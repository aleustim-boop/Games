<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="тень" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
  <!-- рисуем в исходной сетке 96×96, поле значка увеличено вдвое до 192×192 -->
  <g transform="scale(2)">
    <!-- мягкая тень под всей сценой -->
    <ellipse cx="48" cy="84" rx="32" ry="6" fill="#000" opacity="0.28" filter="url(#тень)"/>

    <!-- яблоко рядом со змейкой -->
    <g>
      <circle cx="74" cy="30" r="11" fill="#e6483d"/>
      <circle cx="70.5" cy="26" r="4" fill="#ff8177" opacity="0.6"/>
      <path d="M 74 19 Q 76 15 80 15.5 Q 78 19 74 19 Z" fill="#5fa832"/>
      <rect x="72.6" y="14.5" width="1.8" height="6" rx="0.9" fill="#6b4423"/>
    </g>

    <!-- тело змейки из квадратных сегментов, идущих к яблоку -->
    <rect x="14" y="60" width="16" height="16" rx="4" fill="#5fa832"/>
    <rect x="28" y="60" width="16" height="16" rx="4" fill="#8fd14f"/>
    <rect x="42" y="60" width="16" height="16" rx="4" fill="#5fa832"/>
    <rect x="50" y="46" width="16" height="16" rx="4" fill="#8fd14f"/>
    <!-- голова -->
    <rect x="50" y="30" width="18" height="18" rx="6" fill="#6fbd3a"/>
    <circle cx="55" cy="36" r="2.4" fill="#ffffff"/>
    <circle cx="63" cy="36" r="2.4" fill="#ffffff"/>
    <circle cx="55.6" cy="36.6" r="1.1" fill="#1c2a12"/>
    <circle cx="63.6" cy="36.6" r="1.1" fill="#1c2a12"/>

    <!-- блик на переднем сегменте тела -->
    <path d="M 45 63 Q 50 61 55 63 Q 50 65 45 67 Z" fill="#ffffff" opacity="0.28"/>
  </g>
</svg>
