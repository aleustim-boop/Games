<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="тень" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
  <!-- рисуем в исходной сетке 96×96, поле значка увеличено вдвое до 192×192 -->
  <g transform="scale(2)">
    <!-- мягкая тень под стопкой -->
    <ellipse cx="48" cy="84" rx="30" ry="6" fill="#000" opacity="0.28" filter="url(#тень)"/>

    <!-- кубик-блок: три грани (верх, левая, правая) дают объём, как у иных значков -->
    <!-- нижний левый кубик — бирюзовый -->
    <g>
      <polygon points="34,45 47,52.5 34,60 21,52.5" fill="#7fe4d1"/>
      <polygon points="21,52.5 34,60 34,75 21,67.5" fill="#3aa896"/>
      <polygon points="47,52.5 34,60 34,75 47,67.5" fill="#2a7d70"/>
    </g>
    <!-- нижний правый кубик — коралловый -->
    <g>
      <polygon points="62,45 75,52.5 62,60 49,52.5" fill="#ffb79e"/>
      <polygon points="49,52.5 62,60 62,75 49,67.5" fill="#e0725a"/>
      <polygon points="75,52.5 62,60 62,75 75,67.5" fill="#b8503b"/>
    </g>
    <!-- верхний кубик в седле между нижними — фиолетовый -->
    <g>
      <polygon points="48,26 61,33.5 48,41 35,33.5" fill="#cdbcf7"/>
      <polygon points="35,33.5 48,41 48,56 35,48.5" fill="#8b6fd9"/>
      <polygon points="61,33.5 48,41 48,56 61,48.5" fill="#6a4fb8"/>
    </g>
  </g>
</svg>
