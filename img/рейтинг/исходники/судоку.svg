<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="бумага" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf6e8"/>
      <stop offset="100%" stop-color="#ecdfc0"/>
    </linearGradient>
    <filter id="тень" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
  <!-- рисуем в исходной сетке 96×96, поле значка увеличено вдвое до 192×192 -->
  <g transform="scale(2)">
    <!-- мягкая тень под планшетом -->
    <ellipse cx="48" cy="82" rx="27" ry="6" fill="#000" opacity="0.28" filter="url(#тень)"/>
    <!-- планшет-подложка -->
    <rect x="14" y="14" width="68" height="68" rx="7" fill="url(#бумага)" stroke="#2c313c" stroke-width="4.5"/>
    <!-- выделенная клетка (верхняя правая) — салатовый акцент проекта -->
    <rect x="59.33" y="14" width="22.67" height="22.67" fill="#d2f76b" opacity="0.85"/>
    <!-- внутренние линии сетки 3×3 -->
    <line x1="36.67" y1="14" x2="36.67" y2="82" stroke="#545b68" stroke-width="2.2"/>
    <line x1="59.33" y1="14" x2="59.33" y2="82" stroke="#545b68" stroke-width="2.2"/>
    <line x1="14" y1="36.67" x2="82" y2="36.67" stroke="#545b68" stroke-width="2.2"/>
    <line x1="14" y1="59.33" x2="82" y2="59.33" stroke="#545b68" stroke-width="2.2"/>
    <!-- внешняя толстая рамка поверх линий -->
    <rect x="14" y="14" width="68" height="68" rx="7" fill="none" stroke="#2c313c" stroke-width="4.5"/>
    <!-- точки условно изображают вписанные цифры, без читаемого текста -->
    <circle cx="59.33" cy="70.67" r="2.3" fill="#33383f"/>
    <circle cx="24.7" cy="43.5" r="2.3" fill="#33383f"/>
    <circle cx="29.6" cy="51.8" r="2.3" fill="#33383f"/>
    <circle cx="42.9" cy="65.6" r="2.3" fill="#33383f"/>
    <circle cx="49.4" cy="65.6" r="2.3" fill="#33383f"/>
    <circle cx="55.9" cy="65.6" r="2.3" fill="#33383f"/>
    <!-- блик сверху слева -->
    <path d="M 18 20 Q 34 14 50 17 Q 36 22 20 28 Z" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
