# Дашборд штаба на постоянном адресе https://igra.medart.com.ua/shtab/
#
# Это НЕ отдельный сайт, а кусок для вставки внутрь server-блока игры (того, где
# «listen 443 ssl»). Здесь нет ни listen, ни server_name, ни сертификатов — они уже у игры.
#
# Откуда идёт запрос:
#   браузер → nginx на igra (443, адрес /shtab/…, этот кусок)
#   → https://<слова>.trycloudflare.com (быстрый туннель cloudflared)
#   → ПК штаба, 127.0.0.1:8791 (штаб/дашборд.js).
# Адрес туннеля меняется при каждом его перезапуске, поэтому он лежит в отдельном
# файле /etc/nginx/shtab-adres.conf с одной строкой
#   set $shtab_host "слова.trycloudflare.com";
# Его пишет «мост» (штаб/мост-дашборда.js) и перезагружает nginx.
#
# Как поставить вручную (от root):
#   echo 'set $shtab_host "слова.trycloudflare.com";' > /etc/nginx/shtab-adres.conf
#   cp /srv/games/server/nginx/shtab.conf /etc/nginx/shtab-location.conf
#   в /etc/nginx/sites-available/igra, внутри server-блока с «listen 443 ssl;»,
#   сразу перед этой строкой добавить:   include /etc/nginx/shtab-location.conf;
#   nginx -t
#   systemctl reload nginx
# Нужен модуль sub_filter (в сборке nginx из Ubuntu он есть).
#
# Дашборд знает только адреса от корня («/важное», «/кусок»). За приставкой /shtab/
# они бы сломались, поэтому приставка снимается при запросе (rewrite), а в ответах
# дописывается обратно (sub_filter). Какие виды абсолютных ссылок есть в дашборде
# (найдено чтением штаб/дашборд.js, страница.js, важное-страница.js, онлайн-страница.js,
# кодекс-страница.js):
#   href="/…"        — ссылки и «крупный» снимок;
#   src="/…"         — картинки (адрес собирается в коде, но начинается с «/»);
#   action="/…"      — формы очереди и «Важного» (сюда же попадает formaction="/…");
#   fetch('/…')      — встроенный js: «/кусок», «/жив»;
#   Location: /…     — перенаправления дашборда (302 на «/» и «/важное/…») — их
#                      правит proxy_redirect, а не sub_filter.
# Те же виды с другими кавычками добавлены про запас.
#
# Известное ограничение: в конфиге игры есть общий запрет любых адресов с папкой
# «штаб» или «эталон» (if ($request_uri ~* …) { return 404; }). Он срежет картинки
# вида /shtab/эталон/x.png: картинки из папки «эталон» через внешний адрес не покажутся.
# Снимки из /снимки/ работают.

# Короткое «приставка без слэша» — отправляем на настоящий адрес.
location = /shtab {
    return 301 /shtab/;
}

# ^~ — чтобы regex-правила игры (для .js, .css, .json и папок) не перебили этот адрес.
location ^~ /shtab/ {
    # Здесь задаётся переменная $shtab_host (пишет мост).
    include /etc/nginx/shtab-adres.conf;

    # proxy_pass с переменной требует свой resolver (на Ubuntu это systemd-resolved).
    resolver 127.0.0.53 valid=30s;

    # Снимаем приставку. После rewrite … break и proxy_pass без адреса на конце nginx
    # отправляет уже изменённый путь (заново закодированный, кириллица доезжает) плюс строку запроса.
    rewrite ^/shtab/(.*)$ /$1 break;
    proxy_pass https://$shtab_host;

    proxy_ssl_server_name on;
    proxy_set_header Host $shtab_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Без сжатия от дашборда sub_filter не смог бы читать ответ.
    proxy_set_header Accept-Encoding "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Ответы-перенаправления дашборда: «/…» → «/shtab/…».
    proxy_redirect / /shtab/;

    # Дописываем приставку ко всем абсолютным ссылкам страниц.
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="/shtab/';
    sub_filter 'src="/' 'src="/shtab/';
    sub_filter 'action="/' 'action="/shtab/';
    sub_filter "fetch('/" "fetch('/shtab/";
    sub_filter "href='/" "href='/shtab/";
    sub_filter "src='/" "src='/shtab/";
    sub_filter "action='/" "action='/shtab/";
    sub_filter 'fetch("/' 'fetch("/shtab/';

    client_max_body_size 64k;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Туннель не отвечает — понятная страница, код остаётся 502.
    # error_page здесь, внутри location, чтобы не задеть саму игру.
    error_page 502 503 504 @shtab_down;
}

# Именованная location обязана лежать на уровне server — поэтому она отдельным блоком.
location @shtab_down {
    default_type text/plain;
    charset utf-8;
    return 502 "Дашборд штаба сейчас не на связи: компьютер штаба выключен или туннель перезапускается.\n";
}
