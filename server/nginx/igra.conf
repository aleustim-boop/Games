# Сайт igra.medart.com.ua — страницы игры и сервер комнат с одной машины.
#
# Откуда приходит игрок:
#   браузер → https://igra.medart.com.ua (сертификат держит Caddy напарника, чужая машина)
#   → WireGuard → socat на хабе → ЭТА ВМ, порт 80, обычный http (https заканчивается раньше).
# Поэтому здесь только 80-й порт и никаких сертификатов: шифрует чужая сторона.
# Настоящий адрес игрока приходит в заголовке X-Forwarded-For, а TCP-источник
# всегда один и тот же (192.168.10.30) — по нему игроков различать нельзя.
#
# Что делает этот файл:
#   1) отдаёт страницы игры файлами прямо с диска (/srv/games — клон репозитория);
#   2) прячет служебное: .git, .claude, bot, server, tests, штаб, эталон, *.md, *.cmd, *.json;
#   3) всё остальное (пути вроде /здоровье, /создать, /что-нового) отправляет
#      серверу комнат на 127.0.0.1:8790.
# Постоянного соединения (WebSocket) у сервера комнат нет — он работает длинными
# опросами (см. заголовок server/сервер.js), поэтому здесь важно только долгое
# ожидание ответа и выключенная буферизация.
#
# Как поставить на ВМ (от root):
#   cp /srv/games/server/nginx/igra.conf /etc/nginx/sites-available/igra
#   ln -sf /etc/nginx/sites-available/igra /etc/nginx/sites-enabled/igra
#   rm -f /etc/nginx/sites-enabled/default      # стандартный сайт тоже держит 80-й порт
#   nginx -t
#   systemctl reload nginx
#
# ВАЖНО про 80-й порт: на ВМ его занимает служба напарника np-igra-local
# (socat 192.168.10.17:80 → 127.0.0.1:8790, то есть мимо nginx, прямо в сервер комнат).
# Пока она работает, домен до nginx не доходит. Решение — за штабом и владельцем:
# либо выключить np-igra-local (тогда nginx и есть вход в дом), либо попросить
# напарника перенаправить socat на другой локальный порт.

server {
    listen 80 default_server;
    server_name igra.medart.com.ua _;

    root /srv/games;
    index index.html;

    # Имена файлов и тексты игры — в UTF-8; без этой строки браузер ломает кириллицу.
    charset utf-8;
    # text/html сюда не пишем: он входит в список всегда, и nginx ругается на повтор.
    charset_types text/css text/plain application/javascript image/svg+xml;

    access_log /var/log/nginx/igra.access.log;
    error_log  /var/log/nginx/igra.error.log;

    # Ходы и настройки — короткие письма; большие посылки игре не нужны.
    client_max_body_size 1m;

    # Текст жмём, картинки уже сжаты.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # ——— что наружу нельзя ———

    # Вторая сетка: тот же запрет, но по ещё не раскодированному виду адреса.
    # Кириллица в ссылке приезжает как %D1%88%D1%82%D0%B0%D0%B1 — если вдруг
    # раскодирование сработает не так, как мы ждём, запрет всё равно сработает.
    if ($request_uri ~* "(^|/)(%D1%88%D1%82%D0%B0%D0%B1|%D1%8D%D1%82%D0%B0%D0%BB%D0%BE%D0%BD)(/|$)") {
        return 404;
    }

    # Всё, что начинается с точки: .git, .gitignore, .claude, .env и прочее скрытое.
    location ~ /\. {
        return 404;
    }

    # Служебные папки проекта. nginx сравнивает раскодированный адрес побайтно,
    # а этот файл в UTF-8 — поэтому кириллические имена ловятся как есть.
    location ~ ^/(bot|server|tests|штаб|эталон)(/|$) {
        return 404;
    }

    # Сводка посещений с номерами Telegram — только для дашборда на этом
    # компьютере; снаружи такой двери нет вовсе (сервер и сам отказывает
    # запросам с X-Forwarded-For, это второй замок).
    location = /штаб-онлайн {
        return 404;
    }

    # Записки, запускалки и любые json — тоже наше внутреннее дело.
    location ~* \.(md|cmd|json)$ {
        return 404;
    }

    # ——— страницы игры ———

    # Есть файл — отдаём файл (html, js/, img/, style*.css, шрифты/).
    # Нет файла — значит это разговор с сервером комнат.
    location / {
        try_files $uri $uri/ @server;
    }

    # ——— сервер комнат ———

    location @server {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Пустой Connection — чтобы соединение к серверу комнат жило между запросами.
        proxy_set_header Connection        "";

        # Длинный опрос: сервер придерживает ответ до события (до 25 с),
        # значит рвать ожидание раньше нельзя, и копить ответ в памяти тоже нельзя.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
