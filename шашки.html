<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Экран телефона: запрещаем масштабирование пальцами, чтобы доска не «уезжала» -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Русские шашки</title>

  <!-- Значок вкладки нарисован прямо здесь (белая шашка на зелёном).
       Картинкой его не кладём: без этой строки браузер сам просит
       /favicon.ico и пишет в консоль красную ошибку 404. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2314532d'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='9'%20fill='%23f6f2e7'%20stroke='%2323150a'%20stroke-width='2'/%3E%3C/svg%3E">

  <!-- ============================================================
       ЗА ЧТО ЦЕПЛЯТЬСЯ ОФОРМИТЕЛЮ.

       Весь вид доски живёт в style-шашки.css. Здесь только список имён,
       которые расставляет js/шашки-экран.js, — чтобы их не приходилось
       выискивать в коде:

         .доска-шашек              — сама доска, сетка 8 на 8
         .доска-шашек--с-метками   — на доске показаны буквы и цифры полей
         .доска-шашек--перевёрнута — доска повёрнута к чёрным (вдвоём
                                     с одного телефона, когда их ход):
                                     первая горизонталь сверху, столбец h
                                     слева, подписи полей уже переставлены
         .поле                     — одна клетка
         .поле--тёмное .поле--светлое  — цвет клетки (играют по тёмным)
         .поле--выбрано            — клетка поднятой шашки
         .поле--можно              — сюда разрешено пойти тихим ходом
         .поле--можно-бой          — сюда разрешено пойти боем
         .поле--отказ              — вспыхивает, когда так ходить нельзя
         .фишка                    — шашка
         .фишка--белая .фишка--чёрная  — чья
         .фишка--дамка             — дамка
         .фишка--может-ходить      — этой шашкой сейчас можно пойти
         .фишка--в-руке            — шашка, которую ведут по цепочке боя
         .фишка--под-боем          — её перепрыгнут следующим прыжком
         .фишка--побита            — побита в этом ходу, но ещё на доске
                                     (турецкий удар: снимут в конце хода)
         .метка-буква .метка-цифра — подписи полей a…h и 1…8
         .обёртка-доски .панель-доски #экран-итога
         #строка-хода              — надпись над доской, а на ней ещё
         .строка-хода--белые .строка-хода--чёрные — чей сейчас ход
                                     (когда партия кончилась — ни того, ни другого)
         #счёт-шашек               — сколько у кого живых шашек
         .выбор-соперника          — ряд кнопок выбора уровня
         .кнопка--выбор .кнопка--активная — переключатели уровня
                                     (оба класса уже есть в style.css)

       Разметку клеток создаёт js/шашки-экран.js, и выглядит она так:

         &lt;div class="поле поле--тёмное" data-поле="c3"&gt;
           &lt;span class="метка-цифра"&gt;3&lt;/span&gt;
           &lt;span class="метка-буква"&gt;c&lt;/span&gt;
           &lt;div class="фишка фишка--белая"&gt;&lt;/div&gt;
         &lt;/div&gt;
       ============================================================ -->

  <!-- ВАЖНО: номер ?v= у своих файлов поднимаем на единицу при каждой правке.
       Иначе браузер (а Telegram — особенно упорно) неделями показывает игрокам
       старую версию. -->
  <link rel="stylesheet" href="style.css?v=22">
  <!-- Общий style.css идёт первым, вид шашек — вторым: при равной силе
       правил побеждает записанное ниже, и оформитель шашек может
       перебить общее правило, не трогая чужой файл. -->
  <link rel="stylesheet" href="style-шашки.css?v=2">

  <!-- Официальный скрипт Telegram: даёт тему оформления. В обычном браузере
       он просто ничего не находит и не мешает. -->
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="приложение">

  <!-- Экран партии. Играть можно вдвоём с одного телефона по очереди
       или против робота: соперника выбирают кнопки под доской. -->
  <section id="экран-шашек" class="экран экран--виден">
    <h1 class="заголовок заголовок--доска">Русские шашки</h1>
    <p id="строка-хода" class="подпись строка-хода--белые">Ходят белые</p>

    <div class="обёртка-доски">
      <!-- Клетки создаёт js/шашки-экран.js — см. пример разметки в шапке. -->
      <div id="доска" class="доска-шашек доска-шашек--с-метками"></div>
    </div>

    <!-- Сколько у кого шашек. Строка обновляется после каждого хода:
         это самое простое «понятно, что происходит» на доске. -->
    <p id="счёт-шашек" class="подпись">Белые 12 · Чёрные 12</p>

    <!-- Соперник и уровень. Выбор уровня сам партию не начинает:
         начинают её две кнопки ниже, и человеку видно, во что он
         сейчас нажал. -->
    <div class="выбор-соперника выбор__кнопки">
      <button id="уровень-лёгкий" type="button" class="кнопка кнопка--выбор">Лёгкий</button>
      <button id="уровень-обычный" type="button" class="кнопка кнопка--выбор кнопка--активная">Обычный</button>
      <button id="уровень-сложный" type="button" class="кнопка кнопка--выбор">Сложный</button>
    </div>

    <div class="панель-доски">
      <button id="кнопка-с-ботом" type="button" class="кнопка кнопка--мелкая">Играть с ботом</button>
      <button id="кнопка-вдвоём" type="button" class="кнопка кнопка--мелкая">Играть вдвоём</button>
      <button id="кнопка-метки" type="button" class="кнопка кнопка--мелкая">Буквы и цифры: да</button>
      <!-- Рекорды шашек — свои, отдельные от дурака. Имя кнопки взято у дурака
           нарочно: в общем style.css у него уже есть звёздочка перед словом,
           и одна и та же кнопка в двух играх выглядит одинаково. -->
      <button id="кнопка-рекорды" type="button" class="кнопка кнопка--мелкая">Рекорды</button>
      <!-- Выход из шашек. Внутри Telegram эта кнопка прячется: там уже есть
           своя системная стрелка «Назад», и две одинаковые кнопки рядом
           только путают. Прячет её js/шашки-телеграм.js. -->
      <button id="кнопка-назад" type="button" class="кнопка кнопка--мелкая">← Назад</button>
    </div>
  </section>

  <!-- Итог партии. Это плашка снизу, а не отдельный экран: доска остаётся
       видна, и последний ход можно рассмотреть. -->
  <section id="экран-итога" class="экран экран--поверх">
    <h2 id="заголовок-итога" class="заголовок">Партия окончена</h2>
    <p id="причина-итога" class="подпись"></p>
    <!-- Серия побед подряд — главная цифра итога. Класс «серия» уже описан
         в общем style.css (рамка цвета подсветки), поэтому новых правил
         оформления для неё не нужно. Пустая строка прячется классом «скрыт». -->
    <p id="серия-шашек" class="серия скрыт"></p>
    <button id="кнопка-ещё" type="button" class="кнопка кнопка--главная">Играть ещё</button>
    <!-- Плашка итога закрывает нижние кнопки, поэтому вход в рекорды нужен
         и здесь: сразу после партии его ищут чаще всего. -->
    <button id="кнопка-рекорды-итог" type="button" class="кнопка кнопка--мелкая">Рекорды</button>
    <!-- По той же причине — выход к выбору соперника. Кнопка убирает плашку
         и открывает ряд кнопок под доской, а новую партию не начинает:
         выбирать уровень и соперника человек будет теми же кнопками,
         что и всегда, а не второй копией их на плашке. -->
    <button id="кнопка-другой-соперник" type="button" class="кнопка кнопка--мелкая">Другой соперник</button>
  </section>

  <!-- Рекорды шашек. Имена «экран-рекордов», «лучший-рекорд»
       и «кнопка-рекорды-назад» те же, что у дурака: их вид уже описан
       в общем style.css, и второй раз то же самое писать незачем.
       А вот сама таблица со своим именем — строки у шашек другие,
       и раскладка дуракова списка им не подходит. -->
  <section id="экран-рекордов" class="экран">
    <h2 class="заголовок">Рекорды шашек</h2>
    <p id="лучший-рекорд" class="подпись"></p>
    <div id="таблица-рекордов-шашек" class="таблица"></div>
    <button id="кнопка-рекорды-назад" type="button" class="кнопка">Назад к доске</button>
  </section>

</div>

<!-- Обвязка Telegram идёт первой — она же и хранилище.
     Это тот самый файл, которым пользуется дурак: он здоровается
     с Telegram, раскрывает окно на весь экран и берёт цвета темы,
     а наружу отдаёт личный счёт игрока (window.Рейтинг). Рекорды шашек
     лежат в нём под своим ключом, отдельно от дуракова. -->
<script src="js/telegram.js?v=9"></script>
<!-- Правила идут первыми: экрану без них рисовать нечего. -->
<script src="js/шашки-правила.js?v=2"></script>
<!-- Соперник-робот. Подключается после правил: без них ему не у кого
     спросить про ходы. -->
<script src="js/шашки-бот.js?v=1"></script>
<!-- Рекорды шашек: запись законченных партий и экран с таблицей. -->
<script src="js/шашки-рекорды.js?v=1"></script>
<!-- Кнопка «Назад» и подстраховка связи с Telegram. Идёт после рекордов:
     кнопка «Назад» сначала закрывает экран рекордов и только потом уводит
     со страницы, а для этого рекорды уже должны быть на месте. -->
<script src="js/шашки-телеграм.js?v=1"></script>
<script src="js/шашки-экран.js?v=5"></script>
</body>
</html>
