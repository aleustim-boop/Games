<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Экран телефона: запрещаем масштабирование пальцами, чтобы стол не «уезжал» -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Подкидной дурак</title>
  <!-- Значок вкладки нарисован прямо здесь (зелёная карта с пикой). Картинкой его
       не кладём: файлов в проекте нет, а без этой строки браузер сам просит
       /favicon.ico и пишет в консоль красную ошибку 404. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2314532d'/%3E%3Ctext%20x='16'%20y='24'%20font-size='22'%20text-anchor='middle'%20fill='%23ffffff'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
  <!-- ВАЖНО: номер ?v= у своих файлов нужно поднимать на единицу каждый раз,
       когда меняется style.css, js/telegram.js или js/game.js.
       Иначе браузер (а Telegram — особенно упорно) неделями показывает
       игрокам старую версию: правку видно только после полной очистки кэша.
       Добавка ?v= к адресу самой страницы файлы НЕ обновляет — версия
       должна стоять именно здесь, в строках подключения. -->
  <link rel="stylesheet" href="style.css?v=3">
  <!-- Официальный скрипт Telegram: даёт тему, кнопки и данные игрока.
       В обычном браузере он просто ничего не находит и не мешает. -->
  <!-- defer обязателен: без него браузер не рисует ни одной карты, пока
       не скачает этот скрипт, и при плохой связи игрок несколько секунд
       смотрит в белый экран. Наш js/telegram.js к позднему появлению
       скрипта готов — он дожидается загрузки страницы. -->
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="приложение">

  <!-- Экран 1. Меню -->
  <section id="экран-меню" class="экран экран--виден">
    <h1 class="заголовок">Подкидной<br>дурак</h1>
    <p class="подпись">Вы против бота</p>

    <!-- Выбор соперника. Кнопка нажата — значит этот уровень и выбран. -->
    <div id="выбор-сложности" class="выбор">
      <span id="подпись-сложности" class="выбор__подпись">Соперник</span>
      <div class="выбор__кнопки">
        <button class="кнопка кнопка--выбор" value="лёгкий">Лёгкий</button>
        <button class="кнопка кнопка--выбор" value="обычный">Обычный</button>
        <button class="кнопка кнопка--выбор" value="сложный">Сложный</button>
      </div>
    </div>

    <button id="кнопка-играть" class="кнопка кнопка--главная">Играть</button>
    <button id="кнопка-рекорды" class="кнопка">Рекорды</button>
    <button id="кнопка-звук" class="кнопка кнопка--мелкая">Звук включён</button>
  </section>

  <!-- Экран 2. Игровой стол -->
  <section id="экран-игры" class="экран">

    <!-- Карты бота: только рубашки и счётчик -->
    <div id="рука-бота" class="рука">
      <div id="карты-бота" class="веер"></div>
      <div id="счётчик-бота" class="счётчик"></div>
    </div>

    <!-- Середина стола: слева колода с козырем, справа выложенные карты -->
    <div id="зона-стола">
      <div id="колода">
        <div id="козырная-карта"></div>
        <div id="верх-колоды"></div>
        <div id="счётчик-колоды" class="счётчик"></div>
      </div>
      <div id="метка-козыря"></div>
      <div id="стол"></div>
    </div>

    <!-- Строка подсказки: что сейчас нужно сделать -->
    <div id="подсказка"></div>

    <!-- Карты человека -->
    <div id="рука-человека" class="рука">
      <div id="карты-человека" class="веер"></div>
    </div>

    <div id="панель-кнопок">
      <!-- Выход из партии. Кнопки «Бито» и «Беру» никогда не показываются
           одновременно, поэтому в строке всегда не больше двух кнопок. -->
      <button id="кнопка-в-меню" class="кнопка кнопка--мелкая">В меню</button>
      <button id="кнопка-завершить" class="кнопка скрыт">Бито</button>
      <button id="кнопка-беру" class="кнопка скрыт">Беру</button>
    </div>

  </section>

  <!-- Экран 3. Результат партии -->
  <section id="экран-результата" class="экран">
    <h2 id="текст-результата" class="заголовок"></h2>
    <p id="пояснение-результата" class="подпись"></p>
    <!-- Сколько побед подряд набрано к этой минуте -->
    <p id="серия-итога" class="серия"></p>
    <button id="кнопка-ещё" class="кнопка кнопка--главная">Играть ещё</button>
    <!-- С экрана итога тоже надо уметь уйти, а не только начать заново -->
    <button id="кнопка-в-меню-итог" class="кнопка кнопка--мелкая">В меню</button>
  </section>

  <!-- Плашка «точно выйти?». Кнопка «В меню» стоит рядом с «Бито» и «Беру»,
       под большим пальцем, поэтому случайное нажатие не должно рушить партию. -->
  <section id="экран-выхода" class="экран">
    <h2 class="заголовок">Выйти в меню?</h2>
    <p class="подпись">Партия прервётся, результат не запишется.</p>
    <button id="кнопка-выход-нет" class="кнопка кнопка--главная">Продолжить партию</button>
    <button id="кнопка-выход-да" class="кнопка кнопка--мелкая">Выйти в меню</button>
  </section>

  <!-- Экран 4. Рекорды: самые длинные серии побед подряд -->
  <section id="экран-рекордов" class="экран">
    <h2 class="заголовок">Рекорды</h2>
    <p id="лучший-рекорд" class="подпись"></p>
    <div id="таблица-рекордов" class="таблица"></div>
    <button id="кнопка-рекорды-назад" class="кнопка">Назад</button>
  </section>

</div>

<!-- Обвязка Telegram идёт первой: к старту игры её функции уже должны быть готовы.
     Номера ?v= поднимаем при каждой правке этих файлов — см. пояснение в <head>. -->
<script src="js/telegram.js?v=3"></script>
<script src="js/game.js?v=4"></script>
</body>
</html>
