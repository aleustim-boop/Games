<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Экран телефона: запрещаем масштабирование пальцами, чтобы доска не «уезжала» -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Шахматы</title>

  <!-- Значок вкладки нарисован прямо здесь (четыре клетки доски).
       Картинкой его не кладём: без этой строки браузер сам просит
       /favicon.ico и пишет в консоль красную ошибку 404. Фигуру
       в значке не рисуем нарочно — она вышла бы разной на разных
       телефонах, а клетки одинаковы везде. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23ead8b4'/%3E%3Crect%20width='16'%20height='16'%20fill='%2396663f'/%3E%3Crect%20x='16'%20y='16'%20width='16'%20height='16'%20fill='%2396663f'/%3E%3C/svg%3E">

  <!-- ============================================================
       ЗА ЧТО ЦЕПЛЯТЬСЯ ОФОРМИТЕЛЮ.

       Пока своего файла оформления у шахмат нет, весь вид лежит
       во временном блоке <style> ниже. Оформитель переносит его
       в style-шахматы.css и подключает третьей строкой — после
       style.css и после этого блока; тогда его правила побеждают
       сами, и страницу править не придётся.

       Имена, которые расставляет js/шахматы-экран.js:

         .доска-шахмат              — сама доска, сетка 8 на 8
         .доска-шахмат--с-метками   — на доске показаны буквы и цифры полей
         .доска-шахмат--перевёрнута — доска повёрнута к чёрным (двое
                                      с одного телефона, когда их ход):
                                      первая горизонталь сверху, столбец h
                                      слева, подписи полей уже переставлены
         .поле                      — одна клетка
         .поле--тёмное .поле--светлое  — цвет клетки (играют по всем 64)
         .поле--выбрано             — клетка поднятой фигуры
         .поле--можно               — сюда разрешено пойти на пустое поле
         .поле--можно-взятие        — здесь разрешено взять фигуру
         .поле--шах                 — поле короля, которому объявлен шах
         .поле--последний           — откуда и куда сходили прошлым ходом
         .поле--отказ               — вспыхивает, когда так ходить нельзя
         .фигура                    — знак фигуры внутри клетки
         .фигура--белая .фигура--чёрная — чья фигура; эти же два класса
                                      висят на знаках в выборе превращения
         .метка-буква .метка-цифра  — подписи полей a…h и 1…8
         .обёртка-доски .панель-доски
         #строка-хода               — надпись над доской, а на ней ещё
         .строка-хода--белые .строка-хода--чёрные — чей сейчас ход
                                      (партия кончилась — ни того, ни другого)
         #экран-итога               — плашка «кто выиграл» снизу
         #экран-превращения .выбор-превращения .кнопка--превращение
                                    — плашка «кем станет пешка», четыре
                                      крупные кнопки под палец
         .знак-фигуры               — крупный знак на кнопке превращения
         .выбор-соперника           — ряд кнопок выбора уровня
         .кнопка--выбор .кнопка--активная — переключатели уровня
                                      (оба класса уже есть в style.css)

       Разметку клеток создаёт js/шахматы-экран.js, и выглядит она так:

         &lt;div class="поле поле--светлое" data-поле="e4"&gt;
           &lt;span class="метка-цифра"&gt;4&lt;/span&gt;
           &lt;span class="метка-буква"&gt;e&lt;/span&gt;
           &lt;span class="фигура фигура--белая"&gt;♟&lt;/span&gt;
         &lt;/div&gt;
       ============================================================ -->

  <!-- ВАЖНО: номер ?v= у своих файлов поднимаем на единицу при каждой правке.
       Иначе браузер (а Telegram — особенно упорно) неделями показывает игрокам
       старую версию. -->
  <link rel="stylesheet" href="style.css?v=22">

  <!-- ============================================================
       ВРЕМЕННЫЙ ВИД ДОСКИ. Живёт здесь, пока оформитель занят
       витриной. Переносится в style-шахматы.css целиком, без
       разбора: тут нет ничего, что нужно оставить в странице.

       Три правила, из которых выведено остальное (те же, что
       у шашек, — доски у двух игр устроены одинаково):

       1. Доска сама себе цвет. И в светлой теме Telegram, и в
          тёмной доска остаётся деревянной. Красить её цветами
          темы нельзя: светлые поля в светлой теме сольются
          с фоном страницы, а белые фигуры потеряют контур.
       2. Клетка отдаёт всё место пальцу. На телефоне в 320 точек
          клетка выходит около 38 — это нижняя граница попадания,
          поэтому доска идёт от края до края, а рядов кнопок
          под ней ровно один.
       3. Подсветки различаются формой, а не только цветом:
          точка — тихий ход, кольцо — взятие, рамка по краю —
          поднятая фигура, красное пятно — шах.
       ============================================================ -->
  <style>
    :root {
      /* Цвета доски. Слева наше имя, справа запасной цвет: обвязка
         или тема при желании подставят своё, ничего не переписывая. */
      --поле-светлое: var(--шахматы-поле-светлое, #ead8b4);
      --поле-тёмное:  var(--шахматы-поле-тёмное,  #96663f);
      --рамка-доски:  var(--шахматы-рамка,        #4b3221);

      /* Знаки фигур. У каждой стороны свой цвет и свой ободок:
         играют по всем 64 полям, и одна и та же фигура должна
         читаться и на светлой клетке, и на тёмной. Держит её
         именно ободок, а не заливка. */
      --фигура-белая:      #faf6ec;
      --фигура-белая-край: #3a2413;
      --фигура-чёрная:      #1b1b1f;
      --фигура-чёрная-край: #e7d9bd;

      /* Золото подсветки не зависит от темы Telegram нарочно: цвет
         кнопки тема присылает свой, сегодня синий, а синее кольцо
         на белой фигуре и на коричневом поле почти не видно. */
      --подсветка: var(--шахматы-подсветка, #ffd66b);

      /* Светофор доски. Тоже свой: «сюда можно», «здесь берём»
         и «так нельзя» обязаны значить одно и то же в любой теме. */
      --ход-тихий:   #21c46b;
      --ход-взятие:  #ff3b30;
      --шах:         #ff3b30;
      --нельзя:      #ff3b30;

      /* Поля по бокам экрана: доске они не мешают (их съедает обёртка
         доски), а кнопкам под доской нужны — иначе те упираются
         в самые края телефона. */
      --поле-экрана: 8px;
    }

    /* ---------- Раскладка экрана партии ----------
       Столбик: название, строка хода, доска, кнопки. Доска забирает
       всю оставшуюся высоту, остальным сжиматься запрещено — иначе
       строка хода «съедается» в ноль, когда сообщение стало длиннее.
       Переменные «--отступ-…» приходят из style.css: это вырез
       телефона и полный экран Telegram, вне Telegram они нулевые. */
    #экран-шахмат {
      align-items: center;
      gap: 6px;
      padding: calc(6px + var(--отступ-сверху))
               calc(var(--поле-экрана) + var(--отступ-справа))
               calc(6px + var(--отступ-снизу))
               calc(var(--поле-экрана) + var(--отступ-слева));
    }
    #экран-шахмат > * { flex-shrink: 0; }

    /* Название служебное: оно говорит, что за игра открыта,
       а смотрят на доску. Поэтому мельче общего заголовка. */
    #экран-шахмат .заголовок--доска {
      font-size: 20px;
      line-height: 1.2;
      text-align: center;
    }

    /* ---------- Строка хода ----------
       Главная надпись экрана: чей ход, есть ли шах, почему отказ.
       Высота задана наименьшей, а не точной: «Ходят чёрные: королю
       шах!» на узком экране встаёт в две строки, и плашка обязана
       вырасти, а не обрезать текст. Доска при этом уменьшится сама. */
    #строка-хода {
      min-height: 30px;
      max-width: 100%;
      margin: 0;
      padding: 5px 12px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--текст);
      text-align: center;
      background: var(--подложка);
      border: 1px solid var(--край);
      border-radius: 999px;
    }

    /* Кружок цвета стороны перед словами. «Ходят белые» человек читает,
       а кружок видит раньше, чем прочтёт. Вдвоём с одного телефона это
       главная подсказка: доску вертят, и чья очередь — видно, не вчитываясь. */
    .строка-хода--белые::before,
    .строка-хода--чёрные::before {
      content: "";
      display: inline-block;
      width: 11px;
      height: 11px;
      margin-right: 7px;
      vertical-align: -1px;
      border-radius: 50%;
      border: 1px solid var(--фигура-белая-край);
    }
    .строка-хода--белые::before  { background: var(--фигура-белая); }
    .строка-хода--чёрные::before { background: var(--фигура-чёрная); border-color: var(--фигура-чёрная-край); }

    /* ---------- Доска ----------
       Обёртка шире экрана ровно на его поля: так доска на телефоне
       встаёт от края до края и клетка выходит крупнее. */
    .обёртка-доски {
      flex: 1 1 auto;
      min-height: 0;
      width: calc(100% + 2 * var(--поле-экрана));
      margin-inline: calc(-1 * var(--поле-экрана));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Запасной размер — на случай, если браузер не умеет мерные блоки
       (container). 250 точек — это всё, что стоит выше и ниже доски:
       название, строка хода, ряд уровней, ряд кнопок и отступы. */
    .доска-шахмат {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: min(100%, calc(100vh - 250px));
      width: min(100%, calc(100dvh - 250px - var(--отступ-сверху) - var(--отступ-снизу)));
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 3px solid var(--рамка-доски);
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.38);
    }

    /* Умеет мерные блоки — считаем размер доски от места, которое ей
       реально осталось, а не от вычтенных на глаз 190 точек. */
    @supports (container-type: size) {
      .обёртка-доски { container-type: size; }
      .доска-шахмат { width: min(100cqw, 100cqh); }

      /* Клетку тоже объявляем мерной: знак фигуры и подписи полей
         должны считаться от размера клетки, а не от шрифта страницы. */
      .поле { container-type: size; }
      .поле .фигура { font-size: 76cqmin; }
      .поле .метка-буква,
      .поле .метка-цифра { font-size: 21cqmin; }
    }

    /* ---------- Клетка ---------- */
    .поле {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .поле--светлое { background: var(--поле-светлое); }
    .поле--тёмное  { background: var(--поле-тёмное); }

    /* ---------- Фигуры ----------
       Знак не трогает нажатия: тап всегда достаётся клетке под ним. */
    .фигура {
      position: relative;
      z-index: 1;
      font-size: 30px;
      line-height: 1;
      pointer-events: none;
    }

    /* Ободок вокруг знака нарисован тенями с четырёх сторон. Он важнее
       заливки: белая фигура на светлом поле и чёрная на тёмном держатся
       именно им. */
    .фигура--белая {
      color: var(--фигура-белая);
      text-shadow:
        -1px -1px 0 var(--фигура-белая-край),  1px -1px 0 var(--фигура-белая-край),
        -1px  1px 0 var(--фигура-белая-край),  1px  1px 0 var(--фигура-белая-край),
         0 2px 3px rgba(0, 0, 0, 0.45);
    }
    .фигура--чёрная {
      color: var(--фигура-чёрная);
      text-shadow:
        -1px -1px 0 var(--фигура-чёрная-край),  1px -1px 0 var(--фигура-чёрная-край),
        -1px  1px 0 var(--фигура-чёрная-край),  1px  1px 0 var(--фигура-чёрная-край),
         0 2px 3px rgba(0, 0, 0, 0.45);
    }

    /* ---------- Куда можно пойти ----------
       Две подсветки бывают на соседних клетках, поэтому различаются
       формой, а не только цветом: точка — пустое поле, кольцо вокруг
       фигуры — взятие. Обе с тёмным контуром, иначе точка терялась бы
       на светлом поле, а кольцо — на тёмном. */
    .поле--можно::before {
      content: "";
      position: absolute;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: var(--ход-тихий);
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.4);
    }
    .поле--можно-взятие::before {
      content: "";
      position: absolute;
      inset: 5%;
      border-radius: 50%;
      border: 4px solid var(--ход-взятие);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(0, 0, 0, 0.4);
    }

    /* Откуда и куда сходили прошлым ходом. Вдвоём с одного телефона
       это первое, что ищет глаз: доска повернулась, и без пометки
       непонятно, что вообще изменилось. */
    .поле--последний { box-shadow: inset 0 0 0 3px rgba(255, 214, 107, 0.5); }

    /* Клетка поднятой фигуры. Стоит НИЖЕ правила про прошлый ход:
       при равной силе побеждает записанное ниже, и на клетке, которая
       и поднята, и была прошлым ходом, победит рамка выбора. */
    .поле--выбрано {
      box-shadow:
        inset 0 0 0 3px var(--подсветка),
        inset 0 0 0 40px rgba(255, 255, 255, 0.08);
    }

    /* Шах. Красное пятно под королём — первое, чего не понимает новичок,
       поэтому оно яркое и лежит поверх цвета клетки, а не вместо него. */
    .поле--шах {
      background-image: radial-gradient(circle,
        rgba(255, 59, 48, 0.95) 0%, rgba(255, 59, 48, 0.55) 45%, rgba(255, 59, 48, 0) 72%);
    }

    /* Так ходить нельзя: клетка дважды вспыхивает красным.
       Просто «ничего не произошло» человек читает как поломку. */
    @keyframes отказ-вспышка {
      0%, 100% { box-shadow: inset 0 0 0 0 var(--нельзя); }
      50%      { box-shadow: inset 0 0 0 5px var(--нельзя); }
    }
    .поле--отказ { animation: отказ-вспышка 0.45s ease-in-out 2; }

    /* ---------- Подписи полей ----------
       В шахматах они почти обязательны: ходы записывают буквами
       и цифрами, и человеку надо видеть, где e4. Выключаются кнопкой. */
    .метка-буква,
    .метка-цифра {
      position: absolute;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      opacity: 0.8;
      pointer-events: none;
    }
    .метка-цифра { top: 2px; left: 3px; }
    .метка-буква { right: 3px; bottom: 2px; }
    .поле--светлое > .метка-буква,
    .поле--светлое > .метка-цифра { color: #6d4a2c; }
    .поле--тёмное > .метка-буква,
    .поле--тёмное > .метка-цифра { color: #f3e4c8; }
    .доска-шахмат:not(.доска-шахмат--с-метками) .метка-буква,
    .доска-шахмат:not(.доска-шахмат--с-метками) .метка-цифра { display: none; }

    /* ---------- Ряд уровней ----------
       Во всю ширину телефона три слова «Лёгкий Обычный Сложный»
       смотрятся полосой и спорят с доской за внимание, поэтому ряд
       ограничен по ширине. Сами кнопки (кнопка--выбор) уже описаны
       в общем style.css. */
    .выбор-соперника.выбор__кнопки {
      width: min(100%, 320px);
      gap: 6px;
    }
    .выбор-соперника .кнопка.кнопка--выбор {
      min-height: 44px;
      padding: 8px 4px;
      font-size: 14px;
    }

    /* ---------- Ряд кнопок под доской ----------
       Каждый лишний ряд отнимает у доски целую клетку. */
    .панель-доски {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    /* ---------- Плашка «кем станет пешка» ----------
       Четыре крупные кнопки, а не выпадающий список: списком в игре
       на телефоне не попасть пальцем, да и выбор тут — часть хода,
       его должно быть видно целиком. */
    .выбор-превращения {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    .кнопка--превращение {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 66px;
      min-height: 66px;
      padding: 6px 8px;
      font-size: 13px;
    }
    .знак-фигуры {
      font-size: 30px;
      line-height: 1;
    }
  </style>

  <!-- Официальный скрипт Telegram: даёт тему оформления. В обычном браузере
       он просто ничего не находит и не мешает. -->
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="приложение">

  <!-- Экран партии. Играть можно вдвоём с одного телефона по очереди
       или против робота: соперника выбирают кнопки под доской. -->
  <section id="экран-шахмат" class="экран экран--виден">
    <h1 class="заголовок заголовок--доска">Шахматы</h1>
    <p id="строка-хода" class="подпись строка-хода--белые">Ходят белые</p>

    <div class="обёртка-доски">
      <!-- Клетки создаёт js/шахматы-экран.js — см. пример разметки в шапке. -->
      <div id="доска" class="доска-шахмат доска-шахмат--с-метками"></div>
    </div>

    <!-- Уровень соперника. Сам по себе выбор партию не начинает: её
         начинают две кнопки ниже, и человеку видно, во что он нажал. -->
    <div class="выбор-соперника выбор__кнопки">
      <button id="уровень-лёгкий" type="button" class="кнопка кнопка--выбор">Лёгкий</button>
      <button id="уровень-обычный" type="button" class="кнопка кнопка--выбор кнопка--активная">Обычный</button>
      <button id="уровень-сложный" type="button" class="кнопка кнопка--выбор">Сложный</button>
    </div>

    <div class="панель-доски">
      <button id="кнопка-с-ботом" type="button" class="кнопка кнопка--мелкая">Играть с ботом</button>
      <button id="кнопка-вдвоём" type="button" class="кнопка кнопка--мелкая">Играть вдвоём</button>
      <!-- Поворот доски к тому, чей ход, — как за настоящим столом просто
           поворачивают доску. Одному человеку, который разбирает позицию
           за обе стороны, это мешает, поэтому выключается. Выбор помним
           между запусками. -->
      <button id="кнопка-поворот" type="button" class="кнопка кнопка--мелкая">Поворот доски: да</button>
      <button id="кнопка-метки" type="button" class="кнопка кнопка--мелкая">Буквы и цифры: да</button>
      <!-- Выход к выбору игры. Шахматы открываются с витрины (index.html)
           отдельной страницей, и дорога обратно должна быть на виду:
           внутри Telegram системная стрелка «Назад» есть не везде, а в
           обычном браузере её вовсе нет. -->
      <button id="кнопка-назад" type="button" class="кнопка кнопка--мелкая">← Назад</button>
    </div>
  </section>

  <!-- Итог партии. Это плашка снизу, а не отдельный экран: доска остаётся
       видна, и последнюю позицию можно рассмотреть. -->
  <section id="экран-итога" class="экран экран--поверх">
    <h2 id="заголовок-итога" class="заголовок">Партия окончена</h2>
    <p id="причина-итога" class="подпись"></p>
    <button id="кнопка-ещё" type="button" class="кнопка кнопка--главная">Играть ещё</button>
    <!-- Плашка итога закрывает кнопки под доской, поэтому выход к выбору
         соперника нужен и здесь. Кнопка убирает плашку и открывает ряд
         кнопок, а новую партию не начинает: выбирать уровень и соперника
         человек будет теми же кнопками, что и всегда, а не второй их копией. -->
    <button id="кнопка-другой-соперник" type="button" class="кнопка кнопка--мелкая">Другой соперник</button>
  </section>

  <!-- Пешка дошла до последней горизонтали. По правилам игрок обязан
       выбрать, кем она станет, и выбор — часть хода: пока не выбрал,
       ход не сделан. Поэтому плашка появляется до хода, а не после,
       и её можно закрыть кнопкой «Передумал» — фигура остаётся поднятой. -->
  <section id="экран-превращения" class="экран экран--поверх">
    <p class="подпись">Кем станет пешка?</p>
    <div class="выбор-превращения">
      <button type="button" class="кнопка кнопка--превращение" data-фигура="ферзь"><span class="знак-фигуры"></span>Ферзь</button>
      <button type="button" class="кнопка кнопка--превращение" data-фигура="ладья"><span class="знак-фигуры"></span>Ладья</button>
      <button type="button" class="кнопка кнопка--превращение" data-фигура="слон"><span class="знак-фигуры"></span>Слон</button>
      <button type="button" class="кнопка кнопка--превращение" data-фигура="конь"><span class="знак-фигуры"></span>Конь</button>
    </div>
    <button id="кнопка-превращение-отмена" type="button" class="кнопка кнопка--мелкая">Передумал</button>
  </section>

</div>

<!-- Обвязка Telegram: здоровается с Telegram, раскрывает окно на весь экран
     и берёт цвета темы. В обычном браузере ничего не находит и не мешает.
     Тот же файл подключают дурак и шашки. -->
<script src="js/telegram.js?v=12"></script>
<!-- Правила идут первыми: экрану без них рисовать нечего. -->
<script src="js/шахматы-правила.js?v=2"></script>
<!-- Соперник-робот. Подключается после правил: без них ему не у кого
     спросить про ходы. -->
<script src="js/шахматы-бот.js?v=1"></script>
<script src="js/шахматы-экран.js?v=3"></script>
</body>
</html>
