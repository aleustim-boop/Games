<!DOCTYPE html>
<!-- Признак вида доски висит на самом верхнем элементе страницы: одно и то
     же правило оформления работает сразу на всех страницах сборника.
     Значения короткие: дерево, камень, классика. Ставит его
     js/нарды-экран.js (функция «применитьДоску»), здесь стоит начальное,
     чтобы доска не мигала неоформленной, пока страница грузится. -->
<html lang="ru" data-доска="дерево">
<head>
  <meta charset="utf-8">
  <!-- Экран телефона: запрещаем масштабирование пальцами, чтобы доска не «уезжала» -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Нарды</title>

  <!-- Значок вкладки нарисован прямо здесь (белая шашка на тёмном дереве).
       Картинкой его не кладём: без этой строки браузер сам просит
       /favicon.ico и пишет в консоль красную ошибку 404. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%236b3f1d'/%3E%3Cpath%20d='M16%204%20L23%2016%20L9%2016%20Z'%20fill='%23f6f2e7'/%3E%3Ccircle%20cx='16'%20cy='24'%20r='5'%20fill='%23f6f2e7'/%3E%3C/svg%3E">

  <!-- ============================================================
       ЗА ЧТО ЦЕПЛЯТЬСЯ ОФОРМИТЕЛЮ.

       Весь вид живёт в style-нарды.css. Здесь только список имён, которые
       расставляет js/нарды-экран.js, — чтобы их не пришлось выискивать
       в коде. Из кода задаётся ТОЛЬКО поведение: какие узлы есть, какие
       у них признаки и куда шашка переезжает. Размеры, отступы, цвета,
       положение — целиком тут, в файле оформления.

         .доска-нард            — сама доска. Фон — картинка набора владельца
                                  (img/нарды/board-empty.png), не CSS-узор;
                                  её кладёт узел .доска__фон, первым внутри
         .доска__фон            — картинка пустой доски, декоративная,
                                  во весь размер .доска-нард
         .пункт                 — одно место на доске (их 24), БЕЗ своего
                                  размера и картинки: он просто точка,
                                  куда встаёт стопка шашек. Положение на
                                  картинке доски задают переменные ниже —
                                  они посчитаны из набора владельца
                                  (board-geometry.json), взять их из
                                  другого места нельзя
         [style="--лево: N%"] [style="--верх: N%"] у .пункт и .бар__половина
                                  — где на картинке доски стоит место.
                                  Это данные владельца, а не наш выбор вида
         .пункт--сверху .пункт--снизу   — с какого края копится стопка шашек
         .пункт--можно          — сюда разрешено пойти выбранной шашкой
         .пункт--выбран         — пункт, с которого шашку подняли
         .пункт--отказ          — вспыхивает, когда так ходить нельзя
         .пункт__цель           — картинка допустимого пункта (набор
                                  владельца, target-ring.svg), отдельный
                                  узел ВНУТРИ .пункт и .бар__половина;
                                  показывать её оформлению — по классу
                                  .пункт--можно у родителя
         [data-пункт]           — номер пункта, 1…24, для отладки и меток
         .бар                   — середина доски, куда уезжают побитые
         .бар__половина .бар--белые .бар--чёрные — две половины бара
         .полка                 — куда складываются вынесенные шашки
         .полка--белые .полка--чёрные
         .шашка                 — шашка. Узел создаётся ОДИН раз на партию
                                  и живёт до её конца: он переезжает, а не
                                  рождается заново. Без этого не бывает
                                  движения — на этом обожглись в картах.
         .шашка--белая .шашка--чёрная
         .шашка__рисунок        — картинка самой шашки (набор владельца,
                                  checker-ivory.png / checker-black.png),
                                  узел ВНУТРИ .шашка
         .шашка__кольцо         — картинка кольца выбора (набор владельца,
                                  selection-ring.svg), тоже узел ВНУТРИ
                                  .шашка; показывать — по классу
                                  .шашка--поднята у родителя
         .шашка--можно-взять    — этой сейчас можно пойти
         .шашка--поднята        — её подняли пальцем
         .шашка--едет           — прямо сейчас переезжает (на время движения)
         [style="--слой: N"]    — какая по счёту в стопке, снизу вверх.
                                  Оформление считает по нему смещение стопки.
         .кубики                — оба кубика
         .кубик                 — один кубик
         .кубик__рисунок        — картинка выпавшей грани (набор владельца,
                                  shared/dice/die-1…6.svg), узел ВНУТРИ .кубик
         .кубик--катится        — пока крутится бросок
         .кубик--сыгран         — этот кубик уже использован в ходу
         .кубик--белые .кубик--чёрные — чей бросок
         [data-очки]            — сколько выпало, 1…6 (для оформления рамки;
                                  сами точки теперь на картинке, не рисуются CSS)
         #строка-хода           — надпись над доской, а на ней ещё
         .строка-хода--белые .строка-хода--чёрные — чей сейчас ход
         #подсказка-хода        — короткая строка «бросьте кубики», «ходов нет»
         #счёт-нард             — сколько кто вынес
         .обёртка-доски #экран-итога — как в шашках
         .выбор-версии          — ряд кнопок «Короткие / Длинные»
         .выбор-доски           — ряд кнопок вида доски
         .кнопка--выбор .кнопка--активная — переключатели (уже есть в style.css)
         .подпись--пояснение    — строчка о разнице версий под кнопками

         .игрок-нард .игрок-нард--соперник .игрок-нард--свой
                                  — панель игрока над/под доской: аватар,
                                  имя, статус «В сети». Таймеров в ней
                                  нет НАРОЧНО — времени на ход ещё нет,
                                  пустая пилюля «--:--» выглядела бы
                                  поломкой (решение штаба)
         .игрок-нард__аватар     — картинка набора владельца
                                  (img/нарды/avatar-neutral.png для
                                  соперника, avatar-active.png для своей)
         .игрок-нард__сведения
         .игрок-нард__имя
         .игрок-нард__статус     — подписи внутри панели игрока: имя и
                                  «В сети»
         .строка-хода__значок    — пустой узел под значок в плашке хода
                                  («Ходят белые» и т.п.). Картинку сюда
                                  не кладём: в задаче путь не назван —
                                  решает оформитель, чем его нарисовать
         .строка-хода__текст     — сам текст плашки хода. ВАЖНО: код
                                  теперь ставит textContent СЮДА, а не на
                                  #строка-хода целиком — иначе значок
                                  стирался бы при каждом обновлении строки
         .действия-хода          — ряд из двух кнопок под подсказкой:
                                  #кнопка-отменить-ход (откатывает весь
                                  ход разом) и #кнопка-закончить-ход
                                  (теперь подписана «Подтвердить»)
         .кнопка__значок
         .кнопка__текст          — картинка (img/нарды/undo.png) и
                                  подпись внутри кнопки «Отменить ход»
         Кнопки «Чат» на странице нет вовсе — она бессмысленна в игре
         с ботом, придёт вместе с чатом отдельным этапом (решение штаба)
         «Вернуть шаг» (по одному перемещению) в ряду кнопок больше нет —
         на макете её нет, её работу целиком делает «Отменить ход». Сама
         возможность в js/нарды-экран.js осталась (функция «вернутьШаг»),
         просто кнопку под неё убрали

         Служебные кнопки (были рядом «В меню / Как играть / Вид доски»
         под доской) переехали в лист «⋯» — устройство один в один со
         столом дурака, все классы уже есть в общем style.css:

         .верх-игры .верх-игры__кнопка — строка «‹ · ⋯» над заголовком,
                                  видна только в браузере (в Telegram её
                                  рисует он сам). «‹» — id «кнопка-в-меню»,
                                  тот же переход, что раньше делала кнопка
                                  «В меню»; «⋯» — id «кнопка-игра-ещё»,
                                  открывает #лист-игры
         .шапка-игры .шапка-игры__заголовок .шапка-игры__подзаголовок
                                  — тот же узел, что у дурака (index.html):
                                  крупно «Нарды», а #режим-партии тихой
                                  строкой пишет js/нарды-экран.js — вариант
                                  и соперник, например «Короткие · сложный
                                  бот». Номер партии не пишем — взять его
                                  неоткуда
         #лист-игры .лист-ещё__фон .лист-ещё__лист .лист-ещё__заголовок
         .лист-ещё__строка .лист-ещё__подпись .лист-ещё__значение
         .лист-ещё__закрыть      — тот же лист и те же классы, что на
                                  столе дурака (см. index.html, «Лист
                                  «Ещё» дурака»), со своим набором строк:
                                  «В меню», «Как играть», «Оформление».
                                  Строки «Звук» и «Вибрация» нет — у нард
                                  пока нет ни того, ни другого (решение
                                  штаба). Строки «Вид доски» тоже нет —
                                  12 сентября владелец решил убрать её,
                                  пока доска одна (три «вида» меняли лишь
                                  оттенок одной и той же картинки), кнопка
                                  вернётся вместе с настоящими разными
                                  досками. Код выбора (js/нарды-экран.js,
                                  «ЧАСТЬ 13. ВИД ДОСКИ») остался нетронутым

       Экран «Оформление» — новый для нард, устройство то же, что у
       дурака (index.html, «Экран «Оформление»»), только раздел рубашки
       не нужен вовсе (у нард нет карт), поэтому в разметке его нет:

         #экран-оформления .оформление__раздел .оформление__подпись
         #раздел-фона #выбор-фона .оформление__кнопки .оформление__выбор
         .оформление__имя        — «Фон стола», общее для всего сборника
                                  (дверь window.ОбщийФон в js/telegram.js);
                                  у нард выбор красит фон вокруг доски, а
                                  не сукно (у нард сукна нет), поэтому
                                  подпись раздела — «Фон стола», не «Сукно
                                  стола»; картинки образцов рисует сама дверь

       «Как играть» приведена к тому же стандарту, что стол: наверху «‹»
       в .верх-игры вместо большой кнопки внизу, заголовок —
       .шапка-игры / .шапка-игры__заголовок (только сам заголовок, без
       подзаголовка режима — он тут не нужен). «⋯» на этом экране нет:
       попасть на него можно только из листа «⋯», второй такой же лист
       внутри не нужен. Ширина строки под неё отдельно не заведена (как
       у #экран-игры или #экран-лобби) — растягивается на всю ширину
       экрана по общему правилу .верх-игры, это на вид почти не заметно.

       Экран «Вид доски» (#экран-вида-доски) убран со страницы 12 сентября
       вместе с обеими кнопками входа — решение владельца, см. пояснение
       у листа «Ещё» выше. Признак «data-доска» на <html> и код в
       js/нарды-экран.js («ЧАСТЬ 13. ВИД ДОСКИ») остались: доска, выбранная
       раньше или на странице шашек, продолжает применяться.

       Экраны выбора своего вида не имеют — берут общий из style.css,
       как экраны дурака и шашек:

         #экран-режимов #экран-бота-нард
         #экран-итога #экран-оформления
       ============================================================ -->

  <link rel="stylesheet" href="style.css?v=56">
  <link rel="stylesheet" href="style-нарды.css?v=8">

  <style>
    /* Пустое поле сверху и снизу держит столбик посередине экрана.
       Правило то же, что на странице шашек. */
    #экран-режимов > :first-child { margin-top: auto; }
    #экран-режимов > :last-child { margin-bottom: auto; }
  </style>

  <!-- Во что играют на этой странице. Строку читает общий js/сеть.js —
       от неё зависят метка в ссылке-приглашении, ключ сохранённой комнаты
       и поле «игра» в запросе «создать». Игры по сети в нардах пока нет,
       но строка ставится сразу и на своём месте — до подключения сети. -->
  <script>window.ИграСтраницы = 'нарды';</script>

  <!-- Официальный скрипт Telegram: даёт тему оформления. В обычном браузере
       он просто ничего не находит и не мешает. -->
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="приложение">

  <!-- Пустой слой для живого фона. Рисует его оформитель, он общий для
       всех игр сборника, поэтому здесь только место под него. -->
  <div class="фон-игры" aria-hidden="true"></div>

  <!-- ============================================================
       Экран 0. Лобби нард — тот же приём, что у шашек (коммит 229fa16)
       и шахмат (fa22366): каркас дурака, но без трёх шагов — настроек
       у нард мало (вариант и сложность бота), и обе умещаются одним
       экраном. Id «экран-лобби» общий с дураком/шашками/шахматами: по
       нему в общем style.css уже описан весь вид (карточка профиля,
       картинки, переключатель, карточки входа) — здесь только разметка.

       ЭТО НОВЫЙ ГЛАВНЫЙ ЭКРАН СТРАНИЦЫ, но по умолчанию (без JS) он
       СКРЫТ: классом «экран--виден» по-прежнему помечен #экран-режимов
       ниже — так страница остаётся рабочей, даже если js/нарды-лобби.js
       не загрузится (запасной вид, как у шашек и шахмат). Загрузится —
       сам спрячет #экран-режимов и покажет лобби вместо него, см.
       js/нарды-лобби.js.

       Переключатели «Вариант» и «Сложность бота» здесь — СВОИ кнопки
       с новыми id (лобби-версия-…, лобби-уровень-…): они не подменяют
       настоящие версия-…/уровень-… на #экран-режимов и #экран-бота-нард
       (те остаются нетронутыми для запасного вида), а только отражают
       их состояние и жмут их по клику — устройство в js/нарды-лобби.js. -->
  <section id="экран-лобби" class="экран">
    <!-- Верхняя строка «‹ · ⋯» — только в браузере; внутри Telegram её
         прячет то же правило style.css, что и у стола. «‹» — свой id
         «кнопка-лобби-назад» (id «кнопка-назад» уже занят кнопкой на
         #экран-режимов): ведёт на витрину, нажимая её же за человека.
         «⋯» — свой id «кнопка-лобби-ещё»: тот же общий лист «⋯», что
         и на столе (js/лист-ещё.js, список «идОткрывающих» в
         js/нарды-экран.js), второй раз лист не заводим. -->
    <div class="верх-игры">
      <button id="кнопка-лобби-назад" type="button" class="верх-игры__кнопка" aria-label="К выбору игры"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 4-8 8 8 8"/></svg></button>
      <button id="кнопка-лобби-ещё" type="button" class="верх-игры__кнопка" aria-label="Ещё" aria-haspopup="dialog" aria-controls="лист-игры" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></button>
    </div>

    <h1 class="лобби__заголовок">Нарды</h1>
    <p class="подпись">Классическая игра для двоих</p>

    <!-- Карточка профиля: имя из Telegram — как у дурака и шашек.
         Вместо серии побед подряд (у нард своего модуля рекордов
         нет вовсе, в отличие от шашек и шахмат) — честная строка
         «Мой счёт» без числа. Класс «…--нет» здесь НЕ ставим: в общем
         style.css он прячет строку целиком (display: none) — это для
         случая «рейтинга нет вовсе», а не «есть текст без числа»; та же
         подпись «Мой счёт», обычным классом, видна как ссылка. Открывает
         личный счёт нард — ту же дверь, что «Профиль» в нижней полосе. -->
    <button id="лобби-профиль" type="button" class="карточка-профиля">
      <span class="аватар" aria-hidden="true"></span>
      <span class="карточка-профиля__текст">
        <span id="лобби-имя" class="карточка-профиля__имя">Вы</span>
        <span class="карточка-профиля__рейтинг">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 2h12v7c0 8-12 8-12 0ZM6 4H2v3c0 4 3 5 5 5M18 4h4v3c0 4-3 5-5 5M12 15v5M7 22h10M9 20h6"/></svg><span class="карточка-профиля__место">Мой счёт</span>
        </span>
      </span>
      <span class="карточка-профиля__стрелка" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="m9 4 8 8-8 8"/></svg></span>
    </button>

    <!-- Картинка-баннер от владельца: доска с фишками и кубиками,
         панорама 528×206 (эталон/нарды-набор/lobby/hero-board-scene.png,
         скопирована в img/нарды/). Подписи-текста поверх картинки нет —
         тот же приём, что у шашек и шахмат. Пропорция рамки под этот
         размер задана в style-нарды.css — общая рамка дурака (16:10)
         обрезала бы доску «cover»-ом до узкой полосы. -->
    <figure class="лобби__картинка">
      <img class="лобби__рисунок" src="img/нарды/hero-board-scene.png" alt="" width="528" height="206" decoding="async">
    </figure>

    <!-- «Вариант» — короткие или длинные нарды, спрашивается первым,

      <button id="лобби-онлайн" type="button" class="карточка-входа карточка-входа--онлайн" disabled>

  <!-- ============================================================
       Экран 1. ВО ЧТО и С КЕМ играть.

       ЭТОТ ЭКРАН ТЕПЕРЬ ЗАПАСНОЙ (тот же приём, что у шашек и шахмат):
       главный вход — лобби выше (#экран-лобби). Класс «экран--виден»

       в этом виде, как работала всегда. Загрузится лобби — оно само
       спрячет этот экран и покажет себя (см. js/нарды-лобби.js).

       Версия спрашивается ПЕРВОЙ и стоит выше соперника нарочно: короткие
       и длинные нарды — две разные игры, и человек, знающий одну, про
       вторую часто и не подозревает. Выбрав не то, он решит, что игра

  <section id="экран-режимов" class="экран экран--виден">

    <button id="кнопка-режим-бот" type="button" class="кнопка кнопка--главная"><span class="кнопка__начало">Играть</span> <span class="кнопка__кого">с ботом</span></button>

    <button id="кнопка-назад" type="button" class="кнопка кнопка--мелкая">К выбору игры</button>
  </section>

  <!-- Экран 2. Игра с ботом: три уровня. Уровень спрашивается только

  <section id="экран-бота-нард" class="экран">

      <!-- Третий уровень, «Мастер», есть (js/нарды-бот.js), но кнопка

           (tests/нарды-турнир.js) дал ему там 66–68% побед над «Сложным»,
           а в коротких — 50–51%, то есть тот же соперник другим именем.
           Кнопка за той же силой — обман, поэтому в коротких её нет;
           список видимых кнопок под версию собирает js/нарды-экран.js. -->
      <div class="выбор-соперника выбор__кнопки">
        <button id="уровень-лёгкий" type="button" class="кнопка кнопка--выбор">Лёгкий</button>
        <button id="уровень-сложный" type="button" class="кнопка кнопка--выбор кнопка--активная">Сложный</button>
        <button id="уровень-мастер" type="button" class="кнопка кнопка--выбор скрыт">Мастер</button>

    <button id="кнопка-бот-вдвоём" type="button" class="кнопка кнопка--мелкая">Лучше вдвоём на этом устройстве</button>
    <button id="кнопка-бот-назад" type="button" class="кнопка кнопка--мелкая">Назад</button>

  <!-- ============================================================
       Экран 4. САМА ИГРА.

       Доска, бар и полки вынесенных строятся из кода один раз при

  <section id="экран-игры" class="экран">

    <!-- Верхняя строка «‹ · ⋯» — только в браузере. Внутри Telegram такую

         устройство то же, что у стола дурака (index.html). «‹» уводит в

    <div class="верх-игры">
      <button id="кнопка-в-меню" type="button" class="верх-игры__кнопка" aria-label="В меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 4-8 8 8 8"/></svg></button>

    </div>

    <!-- Заголовок по эталону: крупно «Нарды» (не меняется), а вариант и

    <header class="шапка-игры">
      <h1 class="шапка-игры__заголовок">Нарды</h1>
      <p id="режим-партии" class="шапка-игры__подзаголовок"></p>
    </header>

    <!-- Панель соперника — над доской. Аватар из набора владельца,
         статус пока только «В сети»: настоящего онлайн-статуса без
         сети нет, а таймер сюда нарочно не кладём (см. комментарий
         оформителю выше). Текст «Соперник» — заглушка на разметке:
         в игре с ботом его меняет js/нарды-экран.js на «Соперник»,

    <div id="игрок-соперник" class="игрок-нард игрок-нард--соперник">

        <span class="игрок-нард__статус">В сети</span>
      </div>

    <div class="обёртка-доски">
      <div id="доска" class="доска-нард"></div>
    </div>

    <!-- Кубики. Не появляются готовыми числами: перед тем как показать
         выпавшее, они катятся — иначе бросок выглядит так, будто игра
         его назначила. -->
    <div id="кубики" class="кубики" aria-live="polite"></div>

    <!-- Панель своего игрока — под доской, тем же устройством, что и
         соперник, только другой аватар и подсветка (её ставит оформитель
         классом --свой). -->
    <div id="игрок-свой" class="игрок-нард игрок-нард--свой">
      <img class="игрок-нард__аватар" src="img/нарды/avatar-active.png" alt="">
      <div class="игрок-нард__сведения">
        <span id="имя-своего" class="игрок-нард__имя">Вы</span>
        <span class="игрок-нард__статус">В сети</span>
      </div>
    </div>

    <!-- Плашка хода: значок (рисует оформитель) плюс текст, который
         меняет код. Подсказка сразу под ней — по макету обе строки
         стоят рядом, а не разнесены кубиками, как было раньше. -->
    <p id="строка-хода" class="строка-хода строка-хода--белые">

    <!-- «Отменить ход» откатывает весь ход разом к тому, что было до
         первого перемещения в нём — на макете это единственная кнопка
         отмены, «Вернуть шаг» (по одному перемещению) из ряда убрана
         (см. пояснение оформителю в шапке файла), сама возможность
         осталась в js/нарды-экран.js. -->
    <div class="действия-хода">
      <button id="кнопка-отменить-ход" type="button" class="кнопка кнопка--мелкая скрыт">

      <button id="кнопка-закончить-ход" type="button" class="кнопка кнопка--главная скрыт">Подтвердить</button>
    </div>

    <p id="счёт-нард" class="подпись">Вынесено: белые 0 · чёрные 0</p>
  </section>

  <!-- Итог партии. Плашка снизу, а не отдельный экран: доска остаётся

  <section id="экран-итога" class="экран экран--поверх">

  <section id="экран-как-играть" class="экран">

    </div>
    <header class="шапка-игры">
      <h1 id="заголовок-правил" class="шапка-игры__заголовок">Как играть</h1>
    </header>
    <div id="текст-правил" class="правила-текст"></div>

  <!-- Экран «Вид доски» убран отсюда 12 сентября (решение владельца):
       доска сейчас одна, три «вида» меняли лишь оттенок одной и той же

       («ЧАСТЬ 13. ВИД ДОСКИ») остался — он читает и хранит настройку
       через общую дверь js/telegram.js, поэтому у игрока со старым
       выбором доска не ломается. Вернём экран, когда появятся настоящие
       разные доски (задача в очереди у штаба). -->

  <!-- Оформление: пока только «Фон стола» — оно общее для всего сборника

       Подпись «Фон стола», а не «Сукно стола»: у нард сукна нет вовсе,
       выбор красит фон страницы вокруг доски. Раздела рубашки карт здесь
       нет вовсе: у нард карт не бывает. Шапка — тот же приём, что на
       «Как играть» и «Вид доски»: «‹» в .верх-игры вместо большой кнопки
       «Назад» внизу; id кнопки прежний (его слушает открытьОформление
       через привязатьКнопки в js/нарды-экран.js). -->
  <section id="экран-оформления" class="экран">
    <div class="верх-игры">
      <button id="кнопка-оформление-назад" type="button" class="верх-игры__кнопка" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 4-8 8 8 8"/></svg></button>
    </div>
    <header class="шапка-игры">
      <h1 class="шапка-игры__заголовок">Оформление</h1>
    </header>
    <div id="раздел-фона" class="оформление__раздел">
      <p class="подпись оформление__подпись">Фон стола</p>
      <div id="выбор-фона" class="оформление__кнопки"></div>
    </div>
  </section>

  <!-- Лист «Ещё» стола нард — тот же лист, что на столе дурака (те же
       классы style.css), со своим набором служебных кнопок: под доской по
       эталону остаются только действия партии, а служебное — здесь.
       Открывается «⋯» в верхней строке, а внутри Telegram — пунктом
       «Настройки» в его меню. Лежит внутри #приложение, как у дурака —
       от этого зависит правило style.css «#приложение:has(...) #лист-игры».
       Строк «Звук» и «Вибрация» нет — у нард пока нет ни того, ни другого. -->
  <div id="лист-игры" class="лист-ещё скрыт" role="dialog" aria-modal="true" aria-labelledby="лист-игры-заголовок">
    <div id="лист-игры-фон" class="лист-ещё__фон"></div>
    <div class="лист-ещё__лист">
      <h2 id="лист-игры-заголовок" class="лист-ещё__заголовок">Ещё</h2>
      <button id="кнопка-лист-игры-меню" type="button" class="лист-ещё__строка">
        <span class="лист-ещё__подпись">В меню</span>
      </button>
      <button id="кнопка-лист-игры-правила" type="button" class="лист-ещё__строка">
        <span class="лист-ещё__подпись">Как играть</span>
      </button>
      <!-- Строка «Вид доски» убрана 12 сентября (решение владельца) —
           см. пояснение в шапке файла. -->
      <button id="кнопка-лист-игры-оформление" type="button" class="лист-ещё__строка">
        <span class="лист-ещё__подпись">Оформление</span>
      </button>
      <button id="кнопка-лист-игры-закрыть" type="button" class="лист-ещё__закрыть">Закрыть</button>
    </div>
  </div>

</div>

<script src="js/нарды-правила.js?v=2"></script>

<!-- Бот. Ходы берёт только у правил, поэтому идёт после них.

<script src="js/нарды-бот.js?v=2"></script>

     дважды (у дурака и здесь) и копии разошлись мелочами. ДО нарды-экран.js:

<script src="js/лист-ещё.js?v=2"></script>

     window.ЭкранРейтинга.открыть('нарды') и .открытьСчёт('нарды'). -->
<script src="js/рейтинг-экран.js?v=11"></script>
<!-- Нижняя полоса «Лобби · Рейтинг · Профиль»: общий на весь сборник

<script src="js/нарды-лобби.js?v=1"></script>

<script src="js/нарды-экран.js?v=11"></script>
