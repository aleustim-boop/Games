<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка: старая разметка + новый game.js</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<!--
  ЭТО НЕ ЧАСТЬ ИГРЫ. Файл тестировщика.

  Что он проверяет. Игрок мог открыть игру раньше, и браузер сохранил
  у себя старую страницу (index.html). Потом вышло обновление, и браузер
  подтянул новый js/game.js, а страницу взял из своей памяти — старую.
  В старой странице нет кнопки «В меню» на экране итога.

  Здесь ровно такая пара: разметка без кнопки «кнопка-в-меню-итог»
  и настоящий js/game.js. Смотрим, что будет.
-->

<div id="приложение">
  <section id="экран-меню" class="экран экран--виден">
    <h1 class="заголовок">Подкидной<br>дурак</h1>
    <p class="подпись">Вы против бота</p>
    <button id="кнопка-играть" class="кнопка кнопка--главная">Играть</button>
  </section>

  <section id="экран-игры" class="экран">
    <div id="рука-бота" class="рука">
      <div id="карты-бота" class="веер"></div>
      <div id="счётчик-бота" class="счётчик"></div>
    </div>
    <div id="зона-стола">
      <div id="колода">
        <div id="козырная-карта"></div>
        <div id="верх-колоды"></div>
        <div id="счётчик-колоды" class="счётчик"></div>
      </div>
      <div id="метка-козыря"></div>
      <div id="стол"></div>
    </div>
    <div id="подсказка"></div>
    <div id="рука-человека" class="рука">
      <div id="карты-человека" class="веер"></div>
    </div>
    <div id="панель-кнопок">
      <button id="кнопка-в-меню" class="кнопка кнопка--мелкая">В меню</button>
      <button id="кнопка-завершить" class="кнопка скрыт">Бито</button>
      <button id="кнопка-беру" class="кнопка скрыт">Беру</button>
    </div>
  </section>

  <section id="экран-результата" class="экран">
    <h2 id="текст-результата" class="заголовок"></h2>
    <p id="пояснение-результата" class="подпись"></p>
    <button id="кнопка-ещё" class="кнопка кнопка--главная">Играть ещё</button>
    <!-- Кнопки «кнопка-в-меню-итог» здесь НЕТ — это и есть старая страница -->
  </section>
</div>

<script src="../js/telegram.js"></script>
<script src="../js/game.js"></script>
</body>
</html>
