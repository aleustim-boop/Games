<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Стенд вёрстки (проверка тестировщика)</title>
  <!-- Значок вкладки — тот же, что в игре. Без него браузер просит
       /favicon.ico и пишет в консоль красную 404, а в консоли стенда должны
       быть видны только настоящие ошибки. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2314532d'/%3E%3Ctext%20x='16'%20y='24'%20font-size='22'%20text-anchor='middle'%20fill='%23ffffff'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
  <style>
    /* Всё оформление ниже — только для самого стенда. Игра его не видит:
       она живёт в рамке, у неё свой style.css и свои переменные темы. */
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: #202226;
      color: #ddd;
      font: 400 13px/1.4 system-ui, sans-serif;
    }

    /* Сцена — серое поле, посреди которого стоит «телефон» */
    #сцена {
      min-height: 100%;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 10px 10px 0;
      box-sizing: border-box;
    }
    #рамка-коробка {
      position: relative;
      /* Тонкая светлая обводка показывает край экрана телефона: без неё
         не видно, где кончается игра и начинается поле стенда. */
      outline: 1px solid #5a5f66;
      background: #000;
      flex: 0 0 auto;
    }
    #рамка { display: block; border: 0; background: #000; }
    /* Подпись с размером — снаружи рамки, чтобы не отнимать у игры ни точки */
    #мерка {
      position: absolute; left: 0; top: -9px;
      font: 600 9px/1 system-ui, sans-serif; color: #8a9099;
    }

    /* Полоска управления */
    #стенд {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 99;
      display: flex; flex-wrap: wrap; gap: 3px; justify-content: center;
      padding: 4px; background: rgba(0,0,0,0.86);
      max-height: 46vh; overflow: auto;
    }
    #стенд button {
      font: 600 11px system-ui, sans-serif; padding: 3px 6px;
      border: 1px solid #888; border-radius: 6px; background: #eee; color: #111; cursor: pointer;
    }
    #стенд button.включена { background: #f0b32d; }
    /* Без этой строки атрибут hidden не сработает: display:flex сильнее */
    #стенд[hidden] { display: none; }
    #стенд .группа {
      align-self: center; padding: 0 4px 0 8px;
      font: 600 10px system-ui, sans-serif; color: #98a0aa; text-transform: lowercase;
    }
    #стенд .разрыв { flex-basis: 100%; height: 0; }
    #стенд .подпись-стенда {
      width: 100%; text-align: center; color: #ddd;
      font: 500 10px/1.35 system-ui, sans-serif; padding-top: 3px;
    }
    #показать-стенд {
      position: fixed; right: 6px; bottom: 6px; z-index: 100;
      font: 600 11px system-ui, sans-serif; padding: 5px 9px;
      border: 1px solid #888; border-radius: 6px; background: #f0b32d; color: #111; cursor: pointer;
    }

    /* Полосы тревоги. Красная — стенд показывает не то, что нужно.
       Жёлтая — показывает то, но с оговоркой. */
    .полоса-тревоги {
      position: fixed; left: 0; right: 0; z-index: 200;
      font: 700 12px/1.35 system-ui, sans-serif; padding: 6px 10px;
    }
    #тревога-стенда { top: 0; background: #a3131a; color: #fff; }
    #оговорка-стенда { top: 0; background: #f0b32d; color: #1a1400; }
    #тревога-стенда + #оговорка-стенда { top: 34px; }
  </style>
</head>
<body>
<!--
  ЭТО НЕ ИГРА, А СТЕНД ДЛЯ ГЛАЗ. Файл тестировщика.

  Зачем: часть перекосов вёрстки видно только в редких положениях — когда
  в руке гора карт, когда на столе шесть пар, когда подсказка длинная, когда
  Telegram прислал светлую тему, когда после сетевой партии под итогом стоят
  три кнопки сразу. Ждать такого в живой партии долго, а иные состояния
  вообще не собрать без второго человека и сервера комнат. Здесь всё это
  включается кнопкой.

  Как смотреть:
      node tests/локальный-сервер.js 8130
      http://127.0.0.1:8130/tests/стенд-вёрстки.html
  Ширину и высоту «телефона» переключают кнопки внизу — окно браузера
  трогать не нужно.

  ГЛАВНОЕ ПРО УСТРОЙСТВО. Стенд НЕ КОПИРУЕТ игру. Он открывает настоящий
  index.html в рамке и переключает состояния прямо в нём.

  Почему так. Раньше разметка игры была переписана сюда руками, и стенд
  дважды соврал именно из-за этого:
    — сперва он грузил оформление позапрошлой версии (номер «?v=» вписывали
      руками в двух местах, и они разъехались) и спокойным голосом показывал
      благополучие, которого не было;
    — потом отстал на три узла: в игре появились «Как играть», «Собрать стол
      заново» и строка ответа под ней, а в копии их не было. Дизайнер не смог
      посмотреть глазами два экрана и выводил их по коду.
  Сторож, который сверял копию с игрой, ловил второй случай, но лечил
  следствие. Рамка убирает причину: разойтись с игрой стенду теперь нечем —
  он показывает её же файл, с её же оформлением и её же скриптами.

  Что осталось сверять. Стенд зовёт игру по именам: функции (перерисовать,
  показатьРезультат) и узлы (кнопка-пересобрать). Переименуют — стенд молча
  перестанет собирать состояние. Поэтому имена собраны в списки в файле
  tests/нутро-стенда.js и проверяются при каждом открытии; пропажа —
  красная полоса сверху.

  ЧЕГО СТЕНД НЕ ДЕЛАЕТ. Он не играет партий и ничего не пишет в рекорды:
  таблица рекордов рисуется образцом из десяти строк, а итог партии
  показывается без записи в хранилище. Сервер комнат ему не нужен вовсе —
  сетевые итоги собираются из ответа сервера, набранного здесь же.
-->

<div id="сцена">
  <div id="рамка-коробка">
    <span id="мерка"></span>
    <iframe id="рамка" title="настоящая игра"></iframe>
  </div>
</div>

<div id="стенд"></div>
<button id="показать-стенд" hidden>панель</button>

<script>
'use strict';

/* Что сейчас показываем. Всё остальное считается из этого. */
var состояние = {
  экран: 'стол',          // стол | меню | правила | рекорды
  карт: 18,               // сколько карт в руке игрока
  пар: 6,                 // сколько пар выложено на стол
  роль: 'атакую',         // 'атакую' — все пары побиты; 'отбиваюсь' — последняя ждёт ответа
  уровень: 'обычный',     // от него зависит подпись «Обычный соперник: 6 карт»
  подсказка: 'нет',       // нет | свежая | остывшая
  выбрана: false,         // приподнять первую карту, как при выборе
  плашка: 'нет',          // что лежит поверх стола (см. кнопки «плашка»)
  ответПересбора: false,  // ответ сервера под кнопкой «Собрать стол заново»
  тема: 'своя',
  ширина: 390,
  /* «Окно» — не лень, а забота о глазах: при высоте настоящего телефона
     (844) нижний край игры прячется за панелью стенда, и «Назад» с «В меню»
     приходится доставать прокруткой. По окну виден весь экран сразу,
     а точные высоты телефонов включаются кнопками рядом. */
  высота: 'окно',
  панельВидна: true
};

/* Цвета, которые Telegram присылает игре. «Своя» — когда никаких переменных
   нет вовсе (обычный браузер): игра берёт свои запасные цвета. */
var ТЕМЫ = {
  'своя': null,
  'тёмная': { 'bg-color': '#17212b', 'text-color': '#f5f5f5', 'hint-color': '#708499',
              'button-color': '#5288c1', 'button-text-color': '#ffffff', 'secondary-bg-color': '#232e3c' },
  'светлая': { 'bg-color': '#ffffff', 'text-color': '#000000', 'hint-color': '#999999',
               'button-color': '#2481cc', 'button-text-color': '#ffffff', 'secondary-bg-color': '#f1f1f1' }
};
var ПОЛЯ_ТЕМЫ = ['bg-color', 'text-color', 'hint-color', 'button-color',
                 'button-text-color', 'secondary-bg-color'];

var рамка = document.getElementById('рамка');
var последняяСводка = null;

/* ---------------------------------------------------------------------
   Полосы тревоги. Стенду нельзя ломаться молча: дизайнер в консоль
   не смотрит, он смотрит на экран.
   --------------------------------------------------------------------- */

function полоса(имя, текст) {
  var узел = document.getElementById(имя);
  if (!текст) {
    if (узел) узел.remove();
    return;
  }
  if (!узел) {
    узел = document.createElement('div');
    узел.id = имя;
    узел.className = 'полоса-тревоги';
    document.body.appendChild(узел);
  }
  узел.textContent = текст;
}

function тревога(текст)  { полоса('тревога-стенда', текст); }
function оговорка(текст) { полоса('оговорка-стенда', текст); }

/* Сюда стучится нутро стенда из рамки, когда в игре что-то упало. */
window.__стендСнаружи = {
  беда: function (текст) {
    тревога('В игре ошибка, и это не вёрстка: ' + текст +
            ' · Состояние на экране могло собраться не до конца.');
  }
};

/* ---------------------------------------------------------------------
   Рамка: настоящая игра внутри стенда
   --------------------------------------------------------------------- */

/**
 * Открыть игру заново.
 *
 * Адрес всегда со свежей меткой времени: у каждого открытия она своя,
 * поэтому браузеру нечего подсунуть из своей памяти — он обязан сходить
 * за index.html заново. Оформление и скрипты внутри рамки грузятся так же,
 * как у живого игрока, — с номерами «?v=» из самой игры. Это нарочно:
 * стенд должен врать ровно тогда, когда врёт игра, и ни секундой раньше.
 */
function открытьИгру() {
  return new Promise(function (готово) {
    рамка.addEventListener('load', function () { готово(); }, { once: true });
    рамка.src = '../index.html?стенд=' + Date.now();
  });
}

/** Вставить в рамку нутро стенда — руки, которые переставят карты в игре. */
function вставитьНутро() {
  return new Promise(function (готово, беда) {
    var док = рамка.contentDocument;
    if (!док) {
      беда(new Error('окно рамки закрыто для стенда'));
      return;
    }
    var скрипт = док.createElement('script');
    скрипт.src = new URL('нутро-стенда.js?свежесть=' + Date.now(), location.href).href;
    скрипт.onload = function () { готово(); };
    скрипт.onerror = function () { беда(new Error('не загрузился tests/нутро-стенда.js')); };
    док.body.appendChild(скрипт);
  });
}

/** Руки стенда внутри рамки. Нет их — значит игра ещё не открылась. */
function нутро() {
  try {
    return рамка.contentWindow && рамка.contentWindow.__стендИгры;
  } catch (е) {
    return null;
  }
}

/* ---------------------------------------------------------------------
   Размер «телефона» и тема
   --------------------------------------------------------------------- */

function размерРамки() {
  var ширина = состояние.ширина === 'окно'
    ? Math.max(280, window.innerWidth - 20)
    : состояние.ширина;
  var высота = состояние.высота === 'окно'
    ? Math.max(320, window.innerHeight - высотаПанели() - 24)
    : состояние.высота;
  return { ширина: ширина, высота: высота };
}

function высотаПанели() {
  var полоска = document.getElementById('стенд');
  return состояние.панельВидна && полоска ? полоска.offsetHeight : 0;
}

function применитьРазмер() {
  var р = размерРамки();
  рамка.style.width = р.ширина + 'px';
  рамка.style.height = р.высота + 'px';
  document.getElementById('мерка').textContent = р.ширина + ' × ' + р.высота;
  document.getElementById('сцена').style.paddingBottom = (высотаПанели() + 16) + 'px';
}

/**
 * Тему ставим на корень документа ВНУТРИ рамки — туда же, куда её ставит
 * настоящий Telegram. Дальше всё считает сам style.css игры.
 */
function применитьТему() {
  var док = рамка.contentDocument;
  if (!док) return;
  var набор = ТЕМЫ[состояние.тема];
  for (var i = 0; i < ПОЛЯ_ТЕМЫ.length; i++) {
    var имя = '--tg-theme-' + ПОЛЯ_ТЕМЫ[i];
    if (набор) док.documentElement.style.setProperty(имя, набор[ПОЛЯ_ТЕМЫ[i]]);
    else док.documentElement.style.removeProperty(имя);
  }
}

/* ---------------------------------------------------------------------
   Сборка состояния
   --------------------------------------------------------------------- */

function собратьПоложение() {
  var руки = нутро();
  if (!руки) return;
  применитьТему();
  try {
    последняяСводка = руки.собрать(состояние);
  } catch (е) {
    тревога('Стенд не смог собрать это состояние: ' + (е && е.message ? е.message : е) +
            ' · Скорее всего, в игре переименовали то, чем стенд пользуется.');
    return;
  }
}

function нарисоватьСтенд() {
  построитьПолосу();
  применитьРазмер();
  собратьПоложение();
  обновитьПодпись();
  применитьРазмер();     // подпись могла перенестись на вторую строку
}

/* ---------------------------------------------------------------------
   Полоска управления
   --------------------------------------------------------------------- */

function кнопка(подпись, включена, действие) {
  var б = document.createElement('button');
  б.textContent = подпись;
  if (включена) б.className = 'включена';
  б.addEventListener('click', function () { действие(); нарисоватьСтенд(); });
  return б;
}

function построитьПолосу() {
  var полоска = document.getElementById('стенд');
  полоска.innerHTML = '';

  function группа(имя) {
    var метка = document.createElement('span');
    метка.className = 'группа';
    метка.textContent = имя;
    полоска.appendChild(метка);
  }
  function разрыв() {
    var пусто = document.createElement('div');
    пусто.className = 'разрыв';
    полоска.appendChild(пусто);
  }

  группа('экран');
  [['стол', 'стол'], ['меню', 'меню'], ['правила', 'как играть'], ['рекорды', 'рекорды']]
    .forEach(function (пара) {
      полоска.appendChild(кнопка(пара[1], состояние.экран === пара[0],
        function () { состояние.экран = пара[0]; }));
    });

  группа('ширина');
  [320, 360, 390, 414, 'окно'].forEach(function (ш) {
    полоска.appendChild(кнопка(ш === 'окно' ? 'по окну' : ш, состояние.ширина === ш,
      function () { состояние.ширина = ш; }));
  });
  группа('высота');
  [568, 667, 844, 'окно'].forEach(function (в) {
    полоска.appendChild(кнопка(в === 'окно' ? 'по окну' : в, состояние.высота === в,
      function () { состояние.высота = в; }));
  });

  разрыв();
  группа('тема');
  ['своя', 'тёмная', 'светлая'].forEach(function (т) {
    полоска.appendChild(кнопка(т, состояние.тема === т, function () { состояние.тема = т; }));
  });

  группа('в руке');
  [6, 12, 18, 20, 26, 35].forEach(function (n) {
    полоска.appendChild(кнопка(n, состояние.карт === n, function () { состояние.карт = n; }));
  });
  группа('пар');
  [0, 3, 6].forEach(function (n) {
    полоска.appendChild(кнопка(n, состояние.пар === n, function () { состояние.пар = n; }));
  });
  группа('роль');
  ['атакую', 'отбиваюсь'].forEach(function (р) {
    полоска.appendChild(кнопка(р, состояние.роль === р, function () { состояние.роль = р; }));
  });
  группа('соперник');
  ['лёгкий', 'обычный', 'сложный'].forEach(function (у) {
    полоска.appendChild(кнопка(у, состояние.уровень === у, function () { состояние.уровень = у; }));
  });

  разрыв();
  /* Два положения подсказки, а не одно: свежую новость игра три секунды
     держит подсвеченной, потом подсветка гаснет. Слова при этом обязаны
     лечь по строкам одинаково — переключите «свежая» ↔ «остывшая» и
     убедитесь, что ни одно слово не переехало, а стол не шелохнулся. */
  группа('подсказка');
  [['нет', 'нет'], ['свежая', 'длинная свежая'], ['остывшая', 'длинная остывшая']]
    .forEach(function (пара) {
      полоска.appendChild(кнопка(пара[1], состояние.подсказка === пара[0],
        function () { состояние.подсказка = пара[0]; }));
    });
  полоска.appendChild(кнопка('карта выбрана', состояние.выбрана,
    function () { состояние.выбрана = !состояние.выбрана; }));
  // Отказ показываем последним действием, уже после общей перерисовки,
  // иначе пометка пропала бы сразу же.
  полоска.appendChild(кнопка('отказ по карте', false, function () {
    setTimeout(function () { var р = нутро(); if (р) р.отказ(); }, 0);
  }));

  разрыв();
  /* Плашки поверх стола. Три сетевых итога разведены нарочно: под ними
     стоят разные кнопки, и разница между ними — это разница между
     «собрать стол заново» и «уйти из партии». Состояние «реванша нет,
     но пересбор есть» до появления этой кнопки никто не видел живьём. */
  группа('плашка');
  [['нет', 'нет'],
   ['выход', 'вопрос о выходе'],
   ['итог-бот', 'итог с ботом'],
   ['сеть-реванш-и-пересбор', 'сеть: реванш + пересбор'],
   ['сеть-только-пересбор', 'сеть: только пересбор'],
   ['сеть-только-реванш', 'сеть: только реванш'],
   ['сеть-ничего', 'сеть: ни реванша, ни пересбора']]
    .forEach(function (пара) {
      полоска.appendChild(кнопка(пара[1], состояние.плашка === пара[0],
        function () { состояние.плашка = пара[0]; }));
    });
  полоска.appendChild(кнопка('+ ответ под пересбором', состояние.ответПересбора,
    function () { состояние.ответПересбора = !состояние.ответПересбора; }));

  разрыв();
  полоска.appendChild(кнопка('открыть игру заново', false, function () {
    setTimeout(поднятьСтенд, 0);
  }));
  полоска.appendChild(кнопка('спрятать панель', false, function () {
    состояние.панельВидна = false;
  }));

  var подпись = document.createElement('div');
  подпись.className = 'подпись-стенда';
  подпись.id = 'подпись-стенда';
  подпись.textContent = '…';
  полоска.appendChild(подпись);

  document.getElementById('стенд').hidden = !состояние.панельВидна;
  document.getElementById('показать-стенд').hidden = состояние.панельВидна;
}

/** Строка внизу: что именно сейчас на экране. */
function обновитьПодпись() {
  var подпись = document.getElementById('подпись-стенда');
  if (!подпись) return;
  var р = размерРамки();
  var текст = 'рамка ' + р.ширина + '×' + р.высота;
  if (последняяСводка && последняяСводка.окно) {
    текст += ' · игра внутри меряет окно ' +
             последняяСводка.окно.ширина + '×' + последняяСводка.окно.высота;
  }
  if (последняяСводка && последняяСводка.разложено) {
    var д = последняяСводка.разложено;
    текст += ' · на столе: в руке ' + д.рука + ', пар ' + д.пар +
             ', у соперника ' + д.соперник + ', в колоде ' + д.колода;
  }
  текст += ' · зелёная рамка — можно ходить, серая — нельзя' +
           ' · карт всего 36, поэтому «26 карт» и «6 пар» вместе не влезают — ' +
           'стенд честно уменьшает число пар' +
           ' · панель стенда живёт ВНЕ рамки и высоту у игры не отнимает: ' +
           'пропорции честные даже с открытой панелью' +
           ' · в рамке живая игра — по картам и кнопкам можно нажимать, ' +
           'любая кнопка стенда собирает состояние заново';
  подпись.textContent = текст;
}

document.getElementById('показать-стенд').addEventListener('click', function () {
  состояние.панельВидна = true;
  нарисоватьСтенд();
});

window.addEventListener('resize', function () { setTimeout(нарисоватьСтенд, 60); });

/* ---------------------------------------------------------------------
   Сторожа.

   Разметкой стенд отстать больше не может — он её не копирует. Но два
   способа соврать у него остались, и оба стоили нам по рабочему дню:

   1) ИМЕНА. Стенд зовёт игру по именам функций и узлов. Переименуют —
      стенд молча покажет пустоту. Список имён лежит в нутре стенда,
      проверяем его при каждом открытии.

   2) ЧЕРСТВОЕ ОФОРМЛЕНИЕ. Внутри рамки style.css грузится так же, как
      у живого игрока, — по номеру «?v=» из index.html. Номер этот правят
      руками, и однажды правку забудут: браузер отдаст вчерашнюю копию,
      игра нарисуется по-вчерашнему, а сказать об этом будет некому.
      Поэтому стенд берёт файл с диска сам, со свежей меткой, и сравнивает
      с тем, что досталось рамке. Разошлись — жёлтая полоса.
   --------------------------------------------------------------------- */

function проверитьИмена() {
  var руки = нутро();
  if (!руки) return;
  var пропало = руки.проверитьДоговор();
  var беды = [];
  if (пропало.узлы.length) {
    беды.push('в index.html больше нет узлов: ' + пропало.узлы.join(', '));
  }
  if (пропало.функции.length) {
    беды.push('в js/game.js больше нет функций: ' + пропало.функции.join(', '));
  }
  if (беды.length) {
    тревога('Стенд разошёлся с игрой — ' + беды.join('; ') +
            '. Часть состояний собрать нельзя. Поправьте списки имён ' +
            'в tests/нутро-стенда.js либо верните имена в игру.');
  }
}

function проверитьСвежестьОформления() {
  var док = рамка.contentDocument;
  if (!док) return;
  var ссылка = док.querySelector('link[rel="stylesheet"]');
  if (!ссылка) return;
  var адресИгры = ссылка.href;                       // ровно тот, что взяла игра
  var адресСДиска = адресИгры.split('?')[0] + '?свежесть=' + Date.now();
  Promise.all([
    fetch(адресИгры).then(function (о) { return о.text(); }),
    fetch(адресСДиска).then(function (о) { return о.text(); })
  ]).then(function (пара) {
    if (пара[0] === пара[1]) return;
    оговорка('Оформление в рамке не совпадает с файлом style.css на диске: ' +
             'браузер отдал игре старую копию. Поднимите номер «?v=» в index.html ' +
             '(или откройте стенд с сервера, который не кэширует) — иначе стенд ' +
             'показывает вчерашнюю вёрстку.');
  }).catch(function () {
    /* Файл не прочитался — это не поломка игры, а способ открытия
       (например, стенд открыли двойным кликом, без локального сервера).
       Про это скажет отдельная проверка ниже. */
  });
}

/* ---------------------------------------------------------------------
   Пуск
   --------------------------------------------------------------------- */

function поднятьСтенд() {
  тревога('');
  оговорка('');
  построитьПолосу();
  применитьРазмер();
  открытьИгру().then(function () {
    if (!рамка.contentDocument) {
      throw new Error('окно рамки закрыто');
    }
    return вставитьНутро();
  }).then(function () {
    проверитьИмена();
    проверитьСвежестьОформления();
    нарисоватьСтенд();
  }).catch(function (е) {
    тревога('Стенд не смог открыть игру в рамке (' + (е && е.message ? е.message : е) + '). ' +
            'Чаще всего причина одна: страницу открыли двойным кликом с диска. ' +
            'Запустите «node tests/локальный-сервер.js 8130» и откройте ' +
            'http://127.0.0.1:8130/tests/стенд-вёрстки.html');
  });
}

поднятьСтенд();
</script>
