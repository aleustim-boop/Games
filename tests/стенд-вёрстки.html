  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2314532d'/%3E%3Ctext%20x='16'%20y='24'%20font-size='22'%20text-anchor='middle'%20fill='%23ffffff'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">

<body>
<!--
  ЭТО НЕ ИГРА, А СТЕНД ДЛЯ ГЛАЗ. Файл тестировщика.

  Зачем: часть перекосов вёрстки видно только в редких положениях — когда
  в руке гора карт, когда на столе шесть пар, когда подсказка длинная, когда

  Как смотреть:
      node tests/локальный-сервер.js 8123

  и сузьте окно браузера до 280, 320 или 390 точек в ширину.

  Игру этот файл не меняет: он берёт настоящие style.css и js/game.js

  ВАЖНО ДЛЯ ТОГО, КТО БУДЕТ ПРАВИТЬ СТЕНД ДАЛЬШЕ.
  Партию здесь НЕЛЬЗЯ собирать вручную из фигурных скобок. Раньше было
  именно так, и когда в игре появился выбор соперника, счётчик стал писать
  «Сложный соперник: 6 карт» — то есть читать поле «сложность», которого
  в самодельной партии не было. Стенд падал с ошибкой и показывал пустой
  экран. Теперь партию выдаёт сама игра (создатьПартию), а стенд только
  переставляет в ней карты. Любое новое поле приедет само.
-->

<div id="приложение">

  <!-- Разметка ниже — точная копия index.html. Копия нужна, чтобы стенд

  <section id="экран-меню" class="экран">
    <h1 class="заголовок">Подкидной<br>дурак</h1>
    <p class="подпись">Вы против бота</p>

  </section>

    <div id="рука-бота" class="рука">

      <button id="кнопка-завершить" class="кнопка скрыт">Бито</button>

<div id="стенд"></div>
<button id="показать-стенд" hidden>панель</button>

<!-- Номер после «?v=» — не настройка, а способ не получить из кэша браузера
     вчерашний файл. Он должен совпадать с тем, что стоит в index.html:
     иначе стенд покажет вёрстку старой игры и будет врать спокойным голосом.
     Меняется игра — меняется и здесь. -->
<script src="../js/telegram.js?v=4"></script>
<script src="../js/game.js?v=18"></script>
<script>
'use strict';

/* Что сейчас показываем. Всё остальное считается из этого. */
var состояние = {
  карт: 18,               // сколько карт в руке игрока
  пар: 6,                 // сколько пар выложено на стол
  роль: 'атакую',         // 'атакую' — все пары побиты; 'отбиваюсь' — последняя ждёт ответа
  уровень: 'обычный',     // от него зависит подпись «Обычный соперник: 6 карт»
  тема: 'своя',
  подсказкаДлинная: false,
  выбрана: false,         // приподнять первую карту, как при выборе
  итог: false,            // плашка «Вы выиграли»
  выход: false,           // плашка «Выйти в меню?»
  панельВидна: true       // сама полоска управления внизу
};

var ТЕМЫ = {
  'своя': null,
  'тёмная': { 'bg-color': '#17212b', 'text-color': '#f5f5f5', 'hint-color': '#708499',
              'button-color': '#5288c1', 'button-text-color': '#ffffff', 'secondary-bg-color': '#232e3c' },
  'светлая': { 'bg-color': '#ffffff', 'text-color': '#000000', 'hint-color': '#999999',
               'button-color': '#2481cc', 'button-text-color': '#ffffff', 'secondary-bg-color': '#f1f1f1' }
};

/* Сколько всего получилось разложить — показываем внизу, чтобы было честно:
   36 карт на всех, поэтому 26 карт в руке и 6 пар на столе одновременно
   не помещаются, и стенд молча уменьшает число пар. */
var разложено = { рука: 0, пар: 0, бот: 0, колода: 0 };

/**
 * Собрать нужное положение на столе.
 *
 * Партию берём у самой игры и лишь переставляем в ней карты. Так стенд
 * получает все поля, какие в партии есть сейчас и появятся потом.
 */
function собратьПоложение() {
  var все = собратьКолоду();          // ♠6…♠Т, ♥6…♥Т, ♦6…♦Т, ♣6…♣Т — по порядку

  /* Раздаём через одну карту, а не подряд. Если брать подряд, в руку уходят
     целые масти — и тогда карту на столе бить нечем: все рамки серые, зелёных
     не видно вовсе. Через одну в руке оказывается по половине каждой масти,
     как в живой партии, и подсветку «можно/нельзя» видно как следует. */
  var порядок = [];
  var ш;
  for (ш = 0; ш < все.length; ш += 2) порядок.push(все[ш]);
  for (ш = 1; ш < все.length; ш += 2) порядок.push(все[ш]);

  партия = создатьПартию(состояние.уровень);

  /* Одну карту всегда оставляем сопернику — иначе партия была бы уже доиграна.
     Больше 35 в руке не бывает и в жизни: это предел, который я намерял
     автопрогоном (соперник с одной картой, колода пуста, стол пуст). */
  var картВРуке = Math.min(состояние.карт, порядок.length - 1);
  var рука = порядок.slice(0, картВРуке);
  var курсор = картВРуке;
  var свободно = порядок.length - курсор - 1;                     // одну карту оставляем боту

  // В роли «отбиваюсь» одна карта на столе ждёт ответа. Берём для неё первую
  // свободную — она из младших, и часть руки её точно бьёт.
  var неотбитая = null;
  if (состояние.роль === 'отбиваюсь' && свободно >= 1) {
    неотбитая = порядок[курсор++];
    свободно--;
  }

  // Сколько ещё пар выкладываем побитыми (по две карты на пару).
  var хочемПобитых = состояние.пар - (неотбитая ? 1 : 0);
  if (состояние.роль === 'отбиваюсь' && хочемПобитых < 0) хочемПобитых = 0;
  var пар = неотбитая ? 1 : 0;
  var стол = [];
  while (стол.length < хочемПобитых && свободно >= 2) {
    стол.push({ атака: порядок[курсор++], защита: порядок[курсор++] });
    свободно -= 2;
    пар++;
  }
  // Неотбитую кладём последней — так она и выглядит в игре: только что зашли.
  if (неотбитая) стол.push({ атака: неотбитая, защита: null });

  var бот = порядок.slice(курсор, курсор + Math.min(6, порядок.length - курсор));
  курсор += бот.length;
  var колода = порядок.slice(курсор);

  партия.руки.человек = рука;
  партия.руки.бот = бот;
  партия.стол = стол;
  партия.колода = колода;
  партия.отбой = [];
  партия.берёт = false;
  партия.завершена = false;
  партия.результат = null;
  // Атакует бот — значит отбиваемся мы, и карты в руке получат подсветку
  // «можно/нельзя». Атакуем мы — подсветка считается по правилам подкидывания.
  партия.атакует = состояние.роль === 'отбиваюсь' ? 'бот' : 'человек';

  // Козырная карта обязана лежать под колодой — на это опирается отрисовка.
  партия.козырнаяКарта = колода.length ? колода[колода.length - 1] : порядок[порядок.length - 1];
  партия.козырь = партия.козырнаяКарта.масть;

  выбраннаяКарта = состояние.выбрана && рука.length ? 0 : null;

  разложено = { рука: рука.length, пар: пар, бот: бот.length, колода: колода.length };

  подобратьРазмерКарты();
  перерисовать();

  if (состояние.подсказкаДлинная) {
    /* Самое длинное сообщение, которое игра может показать по-настоящему.
       Строка внизу одна на всё: слева рассказ о том, что случилось, справа —
       что делать дальше. Места ей отведено жёстко (на обычном телефоне —
       две строчки), и лишнее не переносится, а срезается, причём сверху
       и снизу: текст стоит по центру. Поэтому стенд обязан показывать
       именно САМЫЙ длинный случай, иначе он покажет благополучие,
       которого нет.

       ЭТУ СТРОКУ НЕ ПРИДУМЫВАЮТ И НЕ ПОДГОНЯЮТ РУКАМИ. Её считает
       tests/самая-длинная-подсказка.js: он поднимает настоящий js/game.js,
       играет им полторы сотни партий и складывает строку теми же словами
       и тем же способом, что и сама игра. Поменяли тексты — пересчёт
       делается одной командой, и новую строку-рекордсменку переносят сюда:

           node tests/самая-длинная-подсказка.js

       История, из-за которой всё это и заведено: рекорд успел смениться
       трижды (81 → 97 → 78 знаков), а записанное здесь число оставалось
       прежним, и стенд проверял не тот случай. Замер от 150 партий,
       4549 ходов, 1821 разной строки: рекорд 78 знаков, длиннее 90 — ноль. */
    var подсказка = document.getElementById('подсказка');
    подсказка.textContent =
      'Соперник сказал «Бито» — в отбой 2 карты, добрали 1 · Ваш ход — выберите карту';
    подсказка.classList.add('подсказка--ваш-ход');
    подсказка.classList.add('подсказка--событие');
  }

  // Плашки показываем так же, как их показывает игра: поверх стола.
  показатьПлашку('экран-результата', состояние.итог);
  показатьПлашку('экран-выхода', состояние.выход);
}

/** Включить или выключить плашку поверх стола. */
function показатьПлашку(id, видно) {
  var узел = document.getElementById(id);
  узел.classList.toggle('экран--виден', видно);
  узел.classList.toggle('экран--поверх', видно);
}

/** Показать, как вздрагивает карта, которой сейчас ходить нельзя (живёт 0,7 с). */
function показатьОтказ() {
  if (!партия.руки.человек.length) return;
  отказатьПоКарте(0, 'Сейчас этой картой ходить нельзя');
}

function применитьТему() {
  var набор = ТЕМЫ[состояние.тема];
  var поля = ['bg-color','text-color','hint-color','button-color','button-text-color','secondary-bg-color'];
  for (var i = 0; i < поля.length; i++) {
    if (набор) document.documentElement.style.setProperty('--tg-theme-' + поля[i], набор[поля[i]]);
    else document.documentElement.style.removeProperty('--tg-theme-' + поля[i]);
  }
}

function кнопка(подпись, включена, действие) {
  var б = document.createElement('button');
  б.textContent = подпись;
  if (включена) б.className = 'включена';
  б.addEventListener('click', function () { действие(); нарисоватьСтенд(); });
  return б;
}

/**
 * Освободить под полоску управления место, чтобы она не легла на руку игрока.
 *
 * Мало сдвинуть экран вверх: игра считает всю свою вёрстку от переменной
 * «--доступно» (высота окна). Если её не уменьшить, стол останется рассчитан
 * на полное окно и уедет под полоску. Поэтому меняем обе величины сразу.
 */
function подогнатьПодПанель() {
  var полоса = document.getElementById('стенд');
  var показать = document.getElementById('показать-стенд');
  var приложение = document.getElementById('приложение');

  if (!состояние.панельВидна) {
    полоса.hidden = true;
    показать.hidden = false;
    приложение.style.bottom = '0px';
    document.documentElement.style.removeProperty('--доступно');
    return;
  }
  полоса.hidden = false;
  показать.hidden = true;
  var высота = полоса.offsetHeight;
  приложение.style.bottom = высота + 'px';
  document.documentElement.style.setProperty('--доступно', (window.innerHeight - высота) + 'px');
}

/**
 * Согласовать размер карты между расчётом и отрисовкой.
 *
 * Оформление может ужать карту сильнее, чем посчитал скрипт игры: скрипт
 * смотрит на высоту окна, а стенд отнял у вёрстки высоту своей полоски.
 * Если размеры разойдутся, веер разложится под крупную карту, а нарисуется
 * мелкая — и между картами появятся щели, которых в игре нет. Поэтому меряем
 * настоящую карту и, если не сошлось, пересобираем веер.
 */
function согласоватьРазмерКарты() {
  for (var проход = 0; проход < 2; проход++) {
    var образец = document.querySelector('#стол .карта') ||
                  document.querySelector('#карты-бота .карта') ||
                  document.querySelector('#козырная-карта .карта');
    if (!образец) return;
    var рамка = образец.getBoundingClientRect();
    var в = Math.round(рамка.height), ш = Math.round(рамка.width);
    if (!в || !ш) return;
    if (Math.abs(в - размерКарты.высота) <= 1 && Math.abs(ш - размерКарты.ширина) <= 1) return;
    размерКарты.высота = в;
    размерКарты.ширина = ш;
    перерисовать();
  }
}

function нарисоватьСтенд() {
  применитьТему();
  построитьПолосу();
  подогнатьПодПанель();     // высота полоски известна — освобождаем под неё место
  собратьПоложение();       // карты раскладываются уже в оставшейся высоте
  обновитьПодпись();
  подогнатьПодПанель();     // подпись могла перенестись на вторую строку
  согласоватьРазмерКарты();
}

function построитьПолосу() {
  var полоса = document.getElementById('стенд');
  полоса.innerHTML = '';

  [6, 12, 18, 20, 26, 35].forEach(function (n) {
    полоса.appendChild(кнопка(n + ' карт', состояние.карт === n, function () { состояние.карт = n; }));
  });
  [0, 3, 6].forEach(function (n) {
    полоса.appendChild(кнопка(n + ' пар', состояние.пар === n, function () { состояние.пар = n; }));
  });
  ['атакую', 'отбиваюсь'].forEach(function (р) {
    полоса.appendChild(кнопка(р, состояние.роль === р, function () { состояние.роль = р; }));
  });
  ['лёгкий', 'обычный', 'сложный'].forEach(function (у) {
    полоса.appendChild(кнопка(у, состояние.уровень === у, function () { состояние.уровень = у; }));
  });
  ['своя', 'тёмная', 'светлая'].forEach(function (т) {
    полоса.appendChild(кнопка(т, состояние.тема === т, function () { состояние.тема = т; }));
  });
  полоса.appendChild(кнопка('длинная подсказка', состояние.подсказкаДлинная,
    function () { состояние.подсказкаДлинная = !состояние.подсказкаДлинная; }));
  полоса.appendChild(кнопка('карта выбрана', состояние.выбрана,
    function () { состояние.выбрана = !состояние.выбрана; }));
  полоса.appendChild(кнопка('плашка итога', состояние.итог,
    function () { состояние.итог = !состояние.итог; }));
  полоса.appendChild(кнопка('вопрос о выходе', состояние.выход,
    function () { состояние.выход = !состояние.выход; }));
  // Отказ показываем последним действием, уже после общей перерисовки,
  // иначе пометка пропала бы сразу же.
  полоса.appendChild(кнопка('отказ по карте', false, function () { setTimeout(показатьОтказ, 0); }));
  полоса.appendChild(кнопка('спрятать панель', false, function () { состояние.панельВидна = false; }));

  var подпись = document.createElement('div');
  подпись.className = 'подпись-стенда';
  подпись.id = 'подпись-стенда';
  подпись.textContent = '…';
  полоса.appendChild(подпись);
}

/** Строка внизу: что именно сейчас на экране. */
function обновитьПодпись() {
  var подпись = document.getElementById('подпись-стенда');
  if (!подпись) return;
  подпись.textContent = 'окно ' + window.innerWidth + '×' + window.innerHeight +
    ' · на экране: в руке ' + разложено.рука + ', пар ' + разложено.пар +
    ', у соперника ' + разложено.бот + ', в колоде ' + разложено.колода +
    ' · зелёная рамка — можно ходить, серая — нельзя' +
    ' · карт всего 36, поэтому «26 карт» и «6 пар» вместе не влезают — стенд честно ' +
    'уменьшает число пар · пропорции судить только со спрятанной панелью: пока она ' +
    'внизу, игре достаётся на ' + document.getElementById('стенд').offsetHeight + ' точек меньше высоты';
}

document.getElementById('показать-стенд').addEventListener('click', function () {
  состояние.панельВидна = true;
  нарисоватьСтенд();
});

window.addEventListener('resize', function () { setTimeout(нарисоватьСтенд, 60); });
нарисоватьСтенд();
</script>
</body>
</html>
